                  "-mkdir releases",
                  f"-mkdir releases/{version}",
                  f"-mkdir releases/{version}/{candidate_channel}",
              ]
              artifact_root = Path(dist_dir) / "releases" / version / "stable"
              artifact_count = 0
              for artifact in manifest.get("artifacts", []):
                  if not isinstance(artifact, dict):
                      raise SystemExit("candidate artifact is not an object")
                  relative = uploader.build_artifact_relative_path(artifact)
                  artifact_count += 1
                  source = artifact_root / relative
                  if not source.is_file():
                      raise SystemExit(f"candidate artifact is missing: {source}")
                  remote_path = f"releases/{version}/{candidate_channel}/{relative}"
                  lines.append(
                      f"-mkdir {uploader.shell_quote(str(Path(remote_path).parent.as_posix()))}"
                  )
                  if not uploader.remote_file_matches(
                      host=host,
                      port=int(port),
                      user=user,
                      private_key=Path(private_key),
                      known_hosts=Path(known_hosts),
                      remote_path=remote_path,
                      expected_size=source.stat().st_size,
                      expected_sha256=hashlib.sha256(source.read_bytes()).hexdigest(),
                  ):
                      lines.append(
                          f"put {uploader.shell_quote(str(source))} "
                          f"{uploader.shell_quote(remote_path)}"
                      )
