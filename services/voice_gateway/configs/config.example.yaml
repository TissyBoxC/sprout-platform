http:
  host: "0.0.0.0"
  port: "8082"

internal:
  # Keep the management API disabled until service identity is configured.
  enabled: false
  auth_token: "change-me"

log:
  level: "info"

redis:
  address: "127.0.0.1:6379"
  password: ""

sub2api:
  base_url: "http://127.0.0.1:8080"
  api_key: "change-me"

security:
  content_policy_enabled: true
  input_filter_enabled: true
  output_filter_enabled: true
  max_input_runes: 1200

# The gateway reads parent policies directly from the platform database. It is
# the same read connection used for usage recording, so no separate policy
# service is required. Set this to the platform PostgreSQL DSN in production.
database:
  dsn: "postgres://sprout:change-me@127.0.0.1:5432/sprout_device_platform?sslmode=disable"

websocket:
  # Keep the realtime endpoint disabled until the device token verifier is set.
  enabled: false
  path: "/v1/voice"
  # Keep a completed conversation reusable for this short follow-up window.
  continuity_window_seconds: 60
