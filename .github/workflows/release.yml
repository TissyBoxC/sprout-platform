name: Release Platform

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-platform
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect version change
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $version" >&2
            exit 1
          fi

          tag="v$version"
          release_exists=false
          tag_exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            tag_exists=true
          fi
          if gh release view "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,targetCommitish \
              > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            release_exists=true
            python3 - "$RUNNER_TEMP/existing-release.json" "$tag" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          path, expected_tag, expected_commit = sys.argv[1:4]
          with open(path, encoding="utf-8") as input_file:
              release = json.load(input_file)
          if release.get("tagName") != expected_tag:
              raise SystemExit("existing GitHub release has an unexpected tag")
          target = str(release.get("targetCommitish", ""))
          if target != expected_commit:
              raise SystemExit(
                  "existing GitHub release targets a different commit"
              )
          PY
          elif [[ "$tag_exists" == "true" ]]; then
            actual_tag_commit="$(
              git ls-remote --tags origin \
                "refs/tags/$tag" "refs/tags/$tag^{}" \
                | awk -v direct="refs/tags/$tag" -v peeled="refs/tags/$tag^{}" '
                  $2 == direct { direct_sha = $1 }
                  $2 == peeled { peeled_sha = $1 }
                  END { print (peeled_sha != "" ? peeled_sha : direct_sha) }
                '
            )"
            if [[ "$actual_tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $tag points at another commit; refusing to replace it." >&2
              exit 1
            fi
            release_exists=false
            echo "Tag $tag already points at the release commit; recovery will attach its GitHub Release."
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"
          echo "Preparing release $tag."

      - name: Load public endpoints
        if: steps.detect.outputs.should_release == 'true'
        id: endpoints
        shell: bash
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          . deploy/public-endpoints.env
          set +a

          if [[ -z "${SPROUT_API_PUBLIC_URL:-}" ]]; then
            echo "SPROUT_API_PUBLIC_URL is missing from deploy/public-endpoints.env" >&2
            exit 1
          fi
          if [[ -z "${SPROUT_DOWNLOAD_PUBLIC_URL:-}" ]]; then
            echo "SPROUT_DOWNLOAD_PUBLIC_URL is missing from deploy/public-endpoints.env" >&2
            exit 1
          fi

          echo "api_url=$SPROUT_API_PUBLIC_URL" >> "$GITHUB_OUTPUT"
          echo "download_url=$SPROUT_DOWNLOAD_PUBLIC_URL" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.detect.outputs.should_release == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: services/device_platform/go.mod
          cache-dependency-path: |
            services/device_platform/go.sum
            services/voice_gateway/go.sum

      - name: Build Go services and package contracts
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/stage dist/github-assets

          (cd services/device_platform && go test ./... && go build -o ../../dist/device-platform ./cmd/device-platform)
          (cd services/voice_gateway && go test ./... && go build -o ../../dist/voice-gateway ./cmd/voice-gateway)
          python3 -m unittest \
            tools.test_upload_release_artifacts \
            tools.test_upload_release_artifacts_http
          bash deploy/cloud/scripts/test-service-upgrade-worker.sh
          bash deploy/cloud/scripts/test-audit-api-internal-access.sh
          bash deploy/cloud/scripts/test-audit-1panel-proxy-headers.sh
          bash deploy/cloud/scripts/test-audit-service-image-override.sh
          bash deploy/cloud/scripts/test-audit-server-firewall.sh
          bash deploy/cloud/scripts/test-download-release-key.sh

          tar -czf "dist/stage/sprout-contracts-${{ steps.detect.outputs.tag }}.tar.gz" packages/contracts
          cp dist/device-platform dist/stage/device-platform
          cp dist/voice-gateway dist/stage/voice-gateway
          cp dist/device-platform "dist/github-assets/sprout-device-platform-${{ steps.detect.outputs.tag }}-linux-amd64"
          cp dist/voice-gateway "dist/github-assets/sprout-voice-gateway-${{ steps.detect.outputs.tag }}-linux-amd64"
          cp "dist/stage/sprout-contracts-${{ steps.detect.outputs.tag }}.tar.gz" dist/github-assets/

      - name: Set up Node.js
        if: steps.detect.outputs.should_release == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/admin_web/package-lock.json

      - name: Build admin web
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix apps/admin_web
          npm run build --prefix apps/admin_web
          tar -czf "dist/stage/sprout-admin-web-${{ steps.detect.outputs.tag }}.tar.gz" -C apps/admin_web dist
          cp "dist/stage/sprout-admin-web-${{ steps.detect.outputs.tag }}.tar.gz" dist/github-assets/

      - name: Set up Java
        if: steps.detect.outputs.should_release == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        if: steps.detect.outputs.should_release == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Set up Gradle cache
        if: steps.detect.outputs.should_release == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build parent app APK
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.detect.outputs.version }}
          API_BASE_URL: ${{ steps.endpoints.outputs.api_url }}
          PARENT_APP_KEYSTORE_BASE64: ${{ secrets.SPROUT_PARENT_APP_KEYSTORE_BASE64 }}
          PARENT_APP_KEYSTORE_PASSWORD: ${{ secrets.SPROUT_PARENT_APP_KEYSTORE_PASSWORD }}
          PARENT_APP_KEY_ALIAS: ${{ secrets.SPROUT_PARENT_APP_KEY_ALIAS }}
          PARENT_APP_KEY_PASSWORD: ${{ secrets.SPROUT_PARENT_APP_KEY_PASSWORD }}
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false -Dorg.gradle.configuration-cache=false
        working-directory: apps/parent_app
        run: |
          set -euo pipefail
          # A release APK must keep one signing identity across versions.
          # Without a stable keystore Android refuses every in-place upgrade,
          # so a missing key is a release blocker rather than a warning.
          if [[ -z "${PARENT_APP_KEYSTORE_BASE64:-}" ||
                -z "${PARENT_APP_KEYSTORE_PASSWORD:-}" ||
                -z "${PARENT_APP_KEY_ALIAS:-}" ||
                -z "${PARENT_APP_KEY_PASSWORD:-}" ]]; then
            echo "Parent app signing secrets are not configured." >&2
            exit 1
          fi
          printf '%s' "$PARENT_APP_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            printf 'storePassword=%s\n' "$PARENT_APP_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$PARENT_APP_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$PARENT_APP_KEY_ALIAS"
            printf 'storeFile=release.jks\n'
          } > android/key.properties
          flutter pub get
          flutter build apk \
            --release \
            --dart-define "API_BASE_URL=$API_BASE_URL" \
            --dart-define "APP_VERSION=$RELEASE_VERSION" \
            --build-name "$RELEASE_VERSION" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --target-platform android-arm,android-arm64
          # The keystore and its passwords must never leave the runner.
          rm -f android/app/release.jks android/key.properties
          cp build/app/outputs/flutter-apk/app-release.apk \
            "../../dist/stage/sprout-parent-app-${{ steps.detect.outputs.tag }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "../../dist/github-assets/sprout-parent-app-${{ steps.detect.outputs.tag }}.apk"

      - name: Generate Chinese release notes
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release_notes.py \
            --version "${{ steps.detect.outputs.version }}" \
            --current-tag "${{ steps.detect.outputs.tag }}" \
            --repository "$GITHUB_REPOSITORY" \
            --output release-notes.md
          cat release-notes.md

      - name: Create release assets checksum
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/releases/${{ steps.detect.outputs.version }}/stable"

          stage_release() {
            platform="$1"
            kind="$2"
            source_name="$3"
            target_name="$4"
            target_dir="dist/releases/${{ steps.detect.outputs.version }}/stable/$platform/$kind"
            mkdir -p "$target_dir"
            cp "dist/stage/$source_name" "$target_dir/$target_name"
          }

          stage_release android apk \
            "sprout-parent-app-${{ steps.detect.outputs.tag }}.apk" \
            "sprout-parent-app-${{ steps.detect.outputs.tag }}.apk"
          stage_release web admin-web \
            "sprout-admin-web-${{ steps.detect.outputs.tag }}.tar.gz" \
            "sprout-admin-web-${{ steps.detect.outputs.tag }}.tar.gz"
          stage_release any contracts \
            "sprout-contracts-${{ steps.detect.outputs.tag }}.tar.gz" \
            "sprout-contracts-${{ steps.detect.outputs.tag }}.tar.gz"
          stage_release linux device-platform \
            "device-platform" \
            "sprout-device-platform-${{ steps.detect.outputs.tag }}-linux-amd64"
          stage_release linux voice-gateway \
            "voice-gateway" \
            "sprout-voice-gateway-${{ steps.detect.outputs.tag }}-linux-amd64"

          find dist/github-assets -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 -I '{}' sha256sum '{}' \
            | sed 's#  dist/github-assets/#  #' > dist/SHA256SUMS
          cp dist/SHA256SUMS dist/github-assets/
          mkdir -p "dist/releases/${{ steps.detect.outputs.version }}/stable/any/checksums"
          cp dist/SHA256SUMS \
            "dist/releases/${{ steps.detect.outputs.version }}/stable/any/checksums/SHA256SUMS"

      - name: Build release index
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        env:
          DOWNLOAD_BASE_URL: ${{ steps.endpoints.outputs.download_url }}
        run: |
          set -euo pipefail
          download_base_url="${DOWNLOAD_BASE_URL:-https://download.clarkhub.cn}"
          python3 tools/release_artifacts.py \
            --root "dist/releases" \
            --version "${{ steps.detect.outputs.version }}" \
            --channel stable \
            --public-base-url "$download_base_url" \
            --title "如此萌屋平台 ${{ steps.detect.outputs.version }}"

      # SPROUT_DOWNLOAD_SFTP_KNOWN_HOSTS is a pinned known_hosts document, not
      # an address to be discovered at release time. It must contain an exact
      # host or [host]:port entry with the SFTP server's public host key.
      - name: Configure SFTP fallback
        id: configure_sftp_fallback
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        env:
          SFTP_PRIVATE_KEY: ${{ secrets.SPROUT_DOWNLOAD_SFTP_PRIVATE_KEY }}
          SFTP_HOST: ${{ secrets.SPROUT_DOWNLOAD_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SPROUT_DOWNLOAD_SFTP_PORT }}
          SFTP_USER: ${{ secrets.SPROUT_DOWNLOAD_SFTP_USER }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SPROUT_DOWNLOAD_SFTP_KNOWN_HOSTS }}
          RELEASE_UPLOAD_TOKEN: ${{ secrets.SPROUT_RELEASE_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          configured=0
          missing=()
          for name in SFTP_PRIVATE_KEY SFTP_HOST SFTP_PORT SFTP_USER SFTP_KNOWN_HOSTS; do
            if [[ -n "${!name:-}" ]]; then
              configured=$((configured + 1))
            else
              missing+=("$name")
            fi
          done

          if [[ "$configured" -eq 0 ]]; then
            echo "sftp_configured=false" >> "$GITHUB_OUTPUT"
            echo "No SFTP fallback is configured; release publication must use the management API."
            exit 0
          fi

          if [[ "${#missing[@]}" -ne 0 ]]; then
            if [[ -n "${RELEASE_UPLOAD_TOKEN:-}" ]]; then
              echo "::warning::SFTP fallback is partially configured; using the management API only. Missing: ${missing[*]}"
              echo "sftp_configured=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "SFTP fallback is partially configured and no management API token is available. Missing: ${missing[*]}" >&2
            exit 1
          fi

          if [[ ! "$SFTP_PORT" =~ ^[0-9]+$ ]] ||
             (( SFTP_PORT < 1 || SFTP_PORT > 65535 )); then
            echo "SFTP_PORT must be an integer between 1 and 65535." >&2
            exit 1
          fi
          if [[ ! "$SFTP_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]*$ ]]; then
            echo "SFTP_HOST must be a hostname or IP address without a scheme, path, whitespace, or leading dash." >&2
            exit 1
          fi
          if [[ ! "$SFTP_USER" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*$ ]]; then
            echo "SFTP_USER contains unsupported characters." >&2
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/sprout-sftp"
          printf '%s\n' "$SFTP_PRIVATE_KEY" > "$RUNNER_TEMP/sprout-sftp/id_ed25519"
          chmod 600 "$RUNNER_TEMP/sprout-sftp/id_ed25519"
          if ! ssh-keygen -y -f "$RUNNER_TEMP/sprout-sftp/id_ed25519" >/dev/null 2>&1; then
            echo "SPROUT_DOWNLOAD_SFTP_PRIVATE_KEY is not a readable private key." >&2
            exit 1
          fi
          if [[ "${DOWNLOAD_PUBLISH_IMMUTABLE:-true}" != "true" ]]; then
            echo "DOWNLOAD_PUBLISH_IMMUTABLE must remain true for versioned releases." >&2
            exit 1
          fi
          known_hosts="$RUNNER_TEMP/sprout-sftp/known_hosts"
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$known_hosts"
          python3 - "$known_hosts" "$SFTP_HOST" "$SFTP_PORT" <<'PY'
          import ipaddress
          import sys
          from pathlib import Path

          known_hosts_path, host, raw_port = sys.argv[1:4]
          port = int(raw_port)
          lines = Path(known_hosts_path).read_text(encoding="utf-8").splitlines()
          entries = []
          for line_number, line in enumerate(lines, start=1):
              stripped = line.strip()
              if not stripped or stripped.startswith("#"):
                  continue
              if stripped.startswith(("@", "!")) or "*" in stripped or "?" in stripped:
                  raise SystemExit(
                      f"known_hosts line {line_number} contains unsupported marker, wildcard, or negation"
                  )
              fields = stripped.split()
              if len(fields) not in (3, 4):
                  raise SystemExit(f"known_hosts line {line_number} is not a standard host key entry")
              hosts, key_type, key_value = fields[-3:]
              if any(
                  host_name.startswith(("!", "*", "|"))
                  or any(character in host_name for character in ("*", "?"))
                  for host_name in hosts.split(",")
              ):
                  raise SystemExit(
                    f"known_hosts line {line_number} contains a wildcard, negation, or hash"
                  )
              if not (
                  key_type.startswith(("ssh-", "ecdsa-", "sk-", "rsa-sha2-"))
              ):
                  raise SystemExit(
                      f"known_hosts line {line_number} uses an unsupported key type: {key_type}"
                  )
              if len(key_value) < 32:
                  raise SystemExit(f"known_hosts line {line_number} has an invalid key value")
              entries.append(hosts.split(","))
          if not entries:
              raise SystemExit("SPROUT_DOWNLOAD_SFTP_KNOWN_HOSTS contains no host key entries")

          normalized_host = host
          try:
              address = ipaddress.ip_address(host)
              normalized_host = address.compressed.lower()
          except ValueError:
              normalized_host = host.lower()
          expected_hosts = {
              normalized_host,
              f"[{normalized_host}]:{port}" if ":" in normalized_host else f"{normalized_host}:{port}",
          }
          if port == 22:
              expected_hosts.add(f"[{normalized_host}]" if ":" in normalized_host else normalized_host)

          def normalize_known_host(host_name):
              host_name = host_name.rstrip(".").lower()
              if host_name.startswith("[") and "]:" in host_name:
                  address_text, port_text = host_name[1:].split("]:", 1)
                  try:
                      return f"[{ipaddress.ip_address(address_text).compressed}]:{port_text}"
                  except ValueError:
                      return host_name
              if host_name.startswith("[") and host_name.endswith("]"):
                  try:
                      return f"[{ipaddress.ip_address(host_name[1:-1]).compressed}]"
                  except ValueError:
                      return host_name
              return host_name

          provided_hosts = {
              normalize_known_host(host_name)
              for entry in entries
              for host_name in entry
          }
          if not expected_hosts.intersection(provided_hosts):
              raise SystemExit(
                  "SPROUT_DOWNLOAD_SFTP_KNOWN_HOSTS does not pin the configured "
                  f"SFTP endpoint host={host} port={port}"
              )
          print(f"validated pinned SFTP host key for {sorted(expected_hosts)[0]}")
          PY
          if [[ "$SFTP_PORT" == "22" ]]; then
            if [[ "$SFTP_HOST" == *:* ]]; then
              host_query="[$SFTP_HOST]"
            else
              host_query="$SFTP_HOST"
            fi
          else
            if [[ "$SFTP_HOST" == *:* ]]; then
              host_query="[$SFTP_HOST]:$SFTP_PORT"
            else
              host_query="$SFTP_HOST:$SFTP_PORT"
            fi
          fi
          if ! ssh-keygen -F "$host_query" -f "$known_hosts" | grep -Eq '^[^#[:space:]]'; then
            echo "SPROUT_DOWNLOAD_SFTP_KNOWN_HOSTS does not contain an exact entry for $host_query." >&2
            exit 1
          fi
          if ! ssh-keygen -F "$host_query" -l -f "$known_hosts" >/dev/null 2>&1; then
            echo "SPROUT_DOWNLOAD_SFTP_KNOWN_HOSTS host key cannot be parsed." >&2
            exit 1
          fi
          echo "sftp_configured=true" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.detect.outputs.should_release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.detect.outputs.should_release == 'true'
        uses: docker/setup-buildx-action@v3

      # A unique run tag holds release candidates. Version and latest tags are
      # moved only after every artifact and checksum has passed verification.
      - name: Build and publish versioned platform images
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.detect.outputs.version }}
          CANDIDATE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(echo "$REGISTRY_OWNER" | tr '[:upper:]' '[:lower:]')"

          docker buildx build \
            --push \
            --tag "ghcr.io/$owner/sprout-device-platform:$CANDIDATE_TAG" \
            --file services/device_platform/Dockerfile \
            .

          docker buildx build \
            --push \
            --tag "ghcr.io/$owner/sprout-voice-gateway:$CANDIDATE_TAG" \
            --file services/voice_gateway/Dockerfile \
            .

          docker buildx build \
            --push \
            --tag "ghcr.io/$owner/sprout-admin-web:$CANDIDATE_TAG" \
            --file apps/admin_web/Dockerfile \
            --build-arg "VITE_API_BASE_URL=" \
            .

          docker buildx build \
            --push \
            --tag "ghcr.io/$owner/sprout-upgrade-worker:$CANDIDATE_TAG" \
            --file deploy/cloud/upgrade_worker/Dockerfile \
            .

      - name: Stage release candidate artifacts
        id: upload_release
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        env:
          RELEASE_UPLOAD_TOKEN: ${{ secrets.SPROUT_RELEASE_UPLOAD_TOKEN }}
          API_BASE_URL: ${{ steps.endpoints.outputs.api_url }}
          DOWNLOAD_BASE_URL: ${{ steps.endpoints.outputs.download_url }}
          SFTP_HOST: ${{ secrets.SPROUT_DOWNLOAD_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SPROUT_DOWNLOAD_SFTP_PORT }}
          SFTP_USER: ${{ secrets.SPROUT_DOWNLOAD_SFTP_USER }}
          SFTP_CONFIGURED: ${{ steps.configure_sftp_fallback.outputs.sftp_configured }}
          DOWNLOAD_PUBLISH_IMMUTABLE: "true"
        run: |
          set -euo pipefail
          api_base_url="${API_BASE_URL:-https://api.clarkhub.cn}"
          download_base_url="${DOWNLOAD_BASE_URL:-https://download.clarkhub.cn}"
          candidate_channel="candidate-${{ github.run_id }}-${{ github.run_attempt }}"
          if [[ "${DOWNLOAD_PUBLISH_IMMUTABLE:-true}" != "true" ]]; then
            echo "DOWNLOAD_PUBLISH_IMMUTABLE must remain true for candidate staging." >&2
            exit 1
          fi

          stage_via_management_api() {
          python3 - \
              "$api_base_url" \
              "$RELEASE_UPLOAD_TOKEN" \
              "dist/releases/${{ steps.detect.outputs.version }}/stable/manifest.json" \
              "dist/releases/${{ steps.detect.outputs.version }}/stable" \
              "$download_base_url" \
              "${{ steps.detect.outputs.version }}" \
              "$candidate_channel" <<'PY'
          import sys
          import urllib.parse
          import urllib.request
          from pathlib import Path

          from tools import upload_release_artifacts_http as uploader

          (
              api_base_url,
              token,
              manifest_path,
              artifact_root,
              download_base_url,
              version,
              candidate_channel,
          ) = sys.argv[1:8]
          manifest = uploader.load_manifest(Path(manifest_path))
          if manifest.get("version") != version:
              raise SystemExit("candidate manifest version does not match the release")
          artifact_root = Path(artifact_root)
          for artifact in manifest["artifacts"]:
              if not isinstance(artifact, dict):
                  raise SystemExit("candidate artifact is not an object")
              source = artifact_root / str(artifact["relative_path"])
              if not source.is_file():
                  raise SystemExit(f"candidate artifact is missing: {source}")
              body, boundary = uploader.multipart_body(
                  {
                      "version": version,
                      "channel": candidate_channel,
                      "platform": str(artifact["platform"]),
                      "kind": str(artifact["kind"]),
                      "filename": str(artifact["file_name"]),
                      "overwrite": "false",
                  },
                  source,
              )
              request = urllib.request.Request(
                  urllib.parse.urljoin(
                      api_base_url.rstrip("/") + "/",
                      "api/v1/release-publication/files",
                  ),
                  data=body,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": f"multipart/form-data; boundary={boundary}",
                      "Content-Length": str(len(body)),
                  },
              )
              try:
                  uploader.request_json(request, f"stage {artifact['file_name']}")
              except uploader.UploadError as error:
                  if "HTTP 409" not in str(error):
                      raise
                  uploader.verify_remote_artifact(
                      public_base_url=f"{download_base_url}/{version}/{candidate_channel}",
                      version=version,
                      channel=candidate_channel,
                      relative_path=str(artifact["relative_path"]),
                      source=source,
