openapi: 3.0.3
info:
  title: 芽系列·初芽 Voice Gateway Internal API
  version: 1.0.0
security:
  - serviceToken: []
paths:
  /healthz:
    get:
      summary: Check service health
      security: []
      responses:
        "200":
          description: Service is healthy
  /readyz:
    get:
      summary: Check service readiness
      security: []
      responses:
        "200":
          description: Service is ready
  /internal/v1/runtime:
    get:
      summary: Read service runtime information
      responses:
        "200":
          description: Runtime information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Service authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /internal/v1/voice/quality:
    get:
      summary: Read bounded preprocessing quality for active voice sessions
      description: Returns only scalar AEC, noise, AGC, and VAD metrics. It never returns PCM, audio, recognized text, or provider payloads.
      responses:
        "200":
          description: Active session quality snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Service authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /internal/v1/vision/tasks:
    post:
      summary: Run one bounded camera/vision task
      description: Accepts symbolic task metadata only. Image bytes and raw pixels
        are never accepted, stored, or logged; results carry bounded labels and a
        short summary with a 24-hour retention window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisionTaskRequest"
      responses:
        "200":
          description: Bounded vision result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Service authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "422":
          description: Invalid or unsafe vision task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "503":
          description: Vision model temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /internal/v1/vision/results/{task_id}:
    get:
      summary: Read one short-lived vision result
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$"
        - name: device_id
          in: query
          required: true
          description: Owning device of the result. The lookup is scoped to this
            device so one device cannot read another device's result.
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$"
      responses:
        "200":
          description: Bounded vision result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Service authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "404":
          description: Result not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: service-token
  schemas:
    VisionTaskRequest:
      type: object
      additionalProperties: false
      required:
        - task_id
        - device_id
        - task_type
      properties:
        task_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$"
        device_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$"
        task_type:
          type: string
          enum:
            - object_recognition
            - picture_book_recognition
            - photo_qa
            - capture
        policy_version:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9_.-]+$"
          description: Effective child-safety policy revision supplied by the
            trusted gateway caller and forwarded to the platform proxy.
        prompt:
          type: string
          maxLength: 500
        frame_width:
          type: integer
          minimum: 0
          maximum: 4096
        frame_height:
          type: integer
          minimum: 0
          maximum: 4096
        frame_bytes:
          type: integer
          minimum: 0
          maximum: 8388608
    ResponseEnvelope:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - request_id
        - data
        - error
      properties:
        schema_version:
          type: string
          const: 1.0.0
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        data:
          type: object
          nullable: true
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{2,63}$"
        message:
          type: string
          minLength: 1
          maxLength: 256
        retryable:
          type: boolean
