          import sys
          from pathlib import Path

          import hashlib

          from tools import upload_release_artifacts as uploader

          (
              dist_dir,
              manifest_path,
              download_base_url,
              version,
              candidate_channel,
              host,
              port,
              user,
              private_key,
              known_hosts,
