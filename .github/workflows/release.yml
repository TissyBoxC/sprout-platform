          import sys
          from urllib.parse import urlsplit

          raw = sys.argv[1]
          if not raw or any(ord(character) < 0x21 or ord(character) > 0x7E for character in raw):
              raise SystemExit("download base URL must contain printable ASCII only")
          if any(character in raw for character in ("?", "#", "@", "\\", "%")):
              raise SystemExit("download base URL must not contain query, fragment, userinfo, escape, or backslash characters")
