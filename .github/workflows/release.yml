name: Release Platform

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-platform
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect version change
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $version" >&2
            exit 1
          fi

          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; skipping."
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Preparing release $tag."

      - name: Load public endpoints
        if: steps.detect.outputs.should_release == 'true'
        id: endpoints
        shell: bash
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          . deploy/public-endpoints.env
          set +a

          if [[ -z "${SPROUT_API_PUBLIC_URL:-}" ]]; then
            echo "SPROUT_API_PUBLIC_URL is missing from deploy/public-endpoints.env" >&2
            exit 1
          fi
          if [[ -z "${SPROUT_DOWNLOAD_PUBLIC_URL:-}" ]]; then
            echo "SPROUT_DOWNLOAD_PUBLIC_URL is missing from deploy/public-endpoints.env" >&2
            exit 1
          fi

          echo "api_url=$SPROUT_API_PUBLIC_URL" >> "$GITHUB_OUTPUT"
          echo "download_url=$SPROUT_DOWNLOAD_PUBLIC_URL" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.detect.outputs.should_release == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: services/device_platform/go.mod
          cache-dependency-path: |
            services/device_platform/go.sum
            services/voice_gateway/go.sum

      - name: Build Go services and package contracts
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/stage dist/github-assets

          (cd services/device_platform && go test ./... && go build -o ../../dist/device-platform ./cmd/device-platform)
          (cd services/voice_gateway && go test ./... && go build -o ../../dist/voice-gateway ./cmd/voice-gateway)
          bash deploy/cloud/scripts/test-service-upgrade-worker.sh

          tar -czf "dist/stage/sprout-contracts-${{ steps.detect.outputs.tag }}.tar.gz" packages/contracts
          cp dist/device-platform dist/stage/device-platform
          cp dist/voice-gateway dist/stage/voice-gateway
          cp dist/device-platform "dist/github-assets/sprout-device-platform-${{ steps.detect.outputs.tag }}-linux-amd64"
          cp dist/voice-gateway "dist/github-assets/sprout-voice-gateway-${{ steps.detect.outputs.tag }}-linux-amd64"
          cp "dist/stage/sprout-contracts-${{ steps.detect.outputs.tag }}.tar.gz" dist/github-assets/

      - name: Set up Node.js
        if: steps.detect.outputs.should_release == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/admin_web/package-lock.json

      - name: Build admin web
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix apps/admin_web
          npm run build --prefix apps/admin_web
          tar -czf "dist/stage/sprout-admin-web-${{ steps.detect.outputs.tag }}.tar.gz" -C apps/admin_web dist
          cp "dist/stage/sprout-admin-web-${{ steps.detect.outputs.tag }}.tar.gz" dist/github-assets/

      - name: Set up Java
        if: steps.detect.outputs.should_release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        if: steps.detect.outputs.should_release == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Set up Gradle cache
        if: steps.detect.outputs.should_release == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build parent app APK
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.detect.outputs.version }}
          API_BASE_URL: ${{ steps.endpoints.outputs.api_url }}
          PARENT_APP_KEYSTORE_BASE64: ${{ secrets.SPROUT_PARENT_APP_KEYSTORE_BASE64 }}
          PARENT_APP_KEYSTORE_PASSWORD: ${{ secrets.SPROUT_PARENT_APP_KEYSTORE_PASSWORD }}
          PARENT_APP_KEY_ALIAS: ${{ secrets.SPROUT_PARENT_APP_KEY_ALIAS }}
          PARENT_APP_KEY_PASSWORD: ${{ secrets.SPROUT_PARENT_APP_KEY_PASSWORD }}
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false -Dorg.gradle.configuration-cache=false
        working-directory: apps/parent_app
        run: |
          set -euo pipefail
          # A release APK must keep one signing identity across versions.
          # Without a stable keystore Android refuses every in-place upgrade,
          # so a missing key is a release blocker rather than a warning.
          if [[ -z "${PARENT_APP_KEYSTORE_BASE64:-}" ||
                -z "${PARENT_APP_KEYSTORE_PASSWORD:-}" ||
                -z "${PARENT_APP_KEY_ALIAS:-}" ||
                -z "${PARENT_APP_KEY_PASSWORD:-}" ]]; then
            echo "Parent app signing secrets are not configured." >&2
            exit 1
          fi
          printf '%s' "$PARENT_APP_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            printf 'storePassword=%s\n' "$PARENT_APP_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$PARENT_APP_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$PARENT_APP_KEY_ALIAS"
            printf 'storeFile=release.jks\n'
          } > android/key.properties
          flutter pub get
          flutter build apk \
            --release \
            --dart-define "API_BASE_URL=$API_BASE_URL" \
            --dart-define "APP_VERSION=$RELEASE_VERSION" \
            --build-name "$RELEASE_VERSION" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --target-platform android-arm,android-arm64
          # The keystore and its passwords must never leave the runner.
          rm -f android/app/release.jks android/key.properties
          cp build/app/outputs/flutter-apk/app-release.apk \
            "../../dist/stage/sprout-parent-app-${{ steps.detect.outputs.tag }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "../../dist/github-assets/sprout-parent-app-${{ steps.detect.outputs.tag }}.apk"

      - name: Generate Chinese release notes
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release_notes.py \
            --version "${{ steps.detect.outputs.version }}" \
            --current-tag "${{ steps.detect.outputs.tag }}" \
            --repository "$GITHUB_REPOSITORY" \
            --output release-notes.md
          cat release-notes.md

      - name: Create release assets checksum
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/releases/${{ steps.detect.outputs.version }}/stable"

          stage_release() {
            platform="$1"
            kind="$2"
            source_name="$3"
            target_name="$4"
            target_dir="dist/releases/${{ steps.detect.outputs.version }}/stable/$platform/$kind"
            mkdir -p "$target_dir"
            cp "dist/stage/$source_name" "$target_dir/$target_name"
          }

          stage_release android apk \
            "sprout-parent-app-${{ steps.detect.outputs.tag }}.apk" \
            "sprout-parent-app-${{ steps.detect.outputs.tag }}.apk"
          stage_release web admin-web \
            "sprout-admin-web-${{ steps.detect.outputs.tag }}.tar.gz" \
            "sprout-admin-web-${{ steps.detect.outputs.tag }}.tar.gz"
          stage_release any contracts \
            "sprout-contracts-${{ steps.detect.outputs.tag }}.tar.gz" \
            "sprout-contracts-${{ steps.detect.outputs.tag }}.tar.gz"
          stage_release linux device-platform \
            "device-platform" \
            "sprout-device-platform-${{ steps.detect.outputs.tag }}-linux-amd64"
          stage_release linux voice-gateway \
            "voice-gateway" \
            "sprout-voice-gateway-${{ steps.detect.outputs.tag }}-linux-amd64"

          find dist/github-assets -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 -I '{}' sha256sum '{}' \
            | sed 's#  dist/github-assets/#  #' > dist/SHA256SUMS
          cp dist/SHA256SUMS dist/github-assets/
          mkdir -p "dist/releases/${{ steps.detect.outputs.version }}/stable/any/checksums"
          cp dist/SHA256SUMS \
            "dist/releases/${{ steps.detect.outputs.version }}/stable/any/checksums/SHA256SUMS"

      - name: Build release index
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        env:
          DOWNLOAD_BASE_URL: ${{ steps.endpoints.outputs.download_url }}
        run: |
          set -euo pipefail
          download_base_url="${DOWNLOAD_BASE_URL:-https://download.clarkhub.cn}"
          python3 tools/release_artifacts.py \
            --root "dist/releases" \
            --version "${{ steps.detect.outputs.version }}" \
            --channel stable \
            --public-base-url "$download_base_url" \
            --title "如此萌屋平台 ${{ steps.detect.outputs.version }}"

      - name: Configure SFTP fallback
        id: configure_sftp_fallback
        if: steps.detect.outputs.should_release == 'true'
        continue-on-error: true
        shell: bash
        env:
          SFTP_PRIVATE_KEY: ${{ secrets.SPROUT_DOWNLOAD_SFTP_PRIVATE_KEY }}
          SFTP_HOST: ${{ secrets.SPROUT_DOWNLOAD_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SPROUT_DOWNLOAD_SFTP_PORT }}
          SFTP_USER: ${{ secrets.SPROUT_DOWNLOAD_SFTP_USER }}
        run: |
          set -euo pipefail
          if [[ -z "${SFTP_PRIVATE_KEY:-}" ||
                -z "${SFTP_HOST:-}" ||
                -z "${SFTP_PORT:-}" ||
                -z "${SFTP_USER:-}" ]]; then
            echo "SFTP fallback credentials are incomplete."
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/sprout-sftp"
          printf '%s\n' "$SFTP_PRIVATE_KEY" > "$RUNNER_TEMP/sprout-sftp/id_ed25519"
          chmod 600 "$RUNNER_TEMP/sprout-sftp/id_ed25519"
          timeout 30 ssh-keyscan -p "$SFTP_PORT" -H "$SFTP_HOST" \
            > "$RUNNER_TEMP/sprout-sftp/known_hosts"
          test -s "$RUNNER_TEMP/sprout-sftp/known_hosts"

      - name: Log in to GitHub Container Registry
        if: steps.detect.outputs.should_release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.detect.outputs.should_release == 'true'
        uses: docker/setup-buildx-action@v3

      # Images are published before the download-server upload so an upload
      # failure cannot block the containers that serve the new publication API.
      - name: Build and publish platform images
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.detect.outputs.version }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(echo "$REGISTRY_OWNER" | tr '[:upper:]' '[:lower:]')"

          docker buildx build \
            --push \
            --tag "ghcr.io/$owner/sprout-device-platform:$RELEASE_VERSION" \
            --tag "ghcr.io/$owner/sprout-device-platform:latest" \
            --file services/device_platform/Dockerfile \
            .

          docker buildx build \
            --push \
            --tag "ghcr.io/$owner/sprout-voice-gateway:$RELEASE_VERSION" \
            --tag "ghcr.io/$owner/sprout-voice-gateway:latest" \
            --file services/voice_gateway/Dockerfile \
            .

          docker buildx build \
            --push \
            --tag "ghcr.io/$owner/sprout-admin-web:$RELEASE_VERSION" \
            --tag "ghcr.io/$owner/sprout-admin-web:latest" \
            --file apps/admin_web/Dockerfile \
            --build-arg "VITE_API_BASE_URL=" \
            .

          docker buildx build \
            --push \
            --tag "ghcr.io/$owner/sprout-upgrade-worker:$RELEASE_VERSION" \
            --tag "ghcr.io/$owner/sprout-upgrade-worker:latest" \
            --file deploy/cloud/upgrade_worker/Dockerfile \
            .

      - name: Publish release artifacts
        id: upload_release
        if: steps.detect.outputs.should_release == 'true'
        # The download service upload depends on external network and proxy
        # configuration. A timeout there must not block the GitHub release,
        # which carries the tag, checksums, and CI-built assets independently.
        continue-on-error: true
        shell: bash
        env:
          RELEASE_UPLOAD_TOKEN: ${{ secrets.SPROUT_RELEASE_UPLOAD_TOKEN }}
          API_BASE_URL: ${{ steps.endpoints.outputs.api_url }}
          DOWNLOAD_BASE_URL: ${{ steps.endpoints.outputs.download_url }}
          SFTP_HOST: ${{ secrets.SPROUT_DOWNLOAD_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SPROUT_DOWNLOAD_SFTP_PORT }}
          SFTP_USER: ${{ secrets.SPROUT_DOWNLOAD_SFTP_USER }}
        run: |
          set -euo pipefail
          api_base_url="${API_BASE_URL:-https://api.clarkhub.cn}"
          download_base_url="${DOWNLOAD_BASE_URL:-https://download.clarkhub.cn}"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          publish_via_management_api() {
            python3 tools/upload_release_artifacts_http.py \
              --api-base-url "$api_base_url" \
              --token "$RELEASE_UPLOAD_TOKEN" \
              --dist dist \
              --version "${{ steps.detect.outputs.version }}" \
              --channel stable \
              --manifest "dist/releases/${{ steps.detect.outputs.version }}/stable/manifest.json" \
              --title "如此萌屋平台 ${{ steps.detect.outputs.version }}" \
              --published-at "$published_at"
          }

          publish_via_sftp() {
            python3 tools/upload_release_artifacts.py \
              --dist dist \
              --version "${{ steps.detect.outputs.version }}" \
              --channel stable \
              --host "$SFTP_HOST" \
              --port "$SFTP_PORT" \
              --user "$SFTP_USER" \
              --private-key "$RUNNER_TEMP/sprout-sftp/id_ed25519" \
              --known-hosts "$RUNNER_TEMP/sprout-sftp/known_hosts" \
              --remote-root releases \
              --index-root releases \
              --manifest "dist/releases/${{ steps.detect.outputs.version }}/stable/manifest.json" \
              --public-base-url "$download_base_url" \
              --title "如此萌屋平台 ${{ steps.detect.outputs.version }}" \
              --published-at "$published_at"
          }

          if [[ -n "${RELEASE_UPLOAD_TOKEN:-}" ]] && publish_via_management_api; then
            exit 0
          fi

          if [[ -s "$RUNNER_TEMP/sprout-sftp/id_ed25519" ]] &&
             [[ -s "$RUNNER_TEMP/sprout-sftp/known_hosts" ]]; then
            echo "::warning::Management API publication failed; retrying through the SFTP fallback."
            publish_via_sftp
            exit 0
          fi

          echo "No usable release publication path is configured." >&2
          exit 1

      - name: Verify published download service
        id: verify_download
        if: steps.detect.outputs.should_release == 'true' && steps.upload_release.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          DOWNLOAD_BASE_URL: ${{ steps.endpoints.outputs.download_url }}
        run: |
          set -euo pipefail
          download_base_url="${DOWNLOAD_BASE_URL:-https://download.clarkhub.cn}"
          curl --fail --silent --show-error --retry 8 --retry-delay 3 \
            "$download_base_url/index.json" > "$RUNNER_TEMP/download-index.json"
          python3 - "$RUNNER_TEMP/download-index.json" "${{ steps.detect.outputs.version }}" <<'PY'
          import json
          import sys

          index_path, version = sys.argv[1], sys.argv[2]
          with open(index_path, encoding="utf-8") as input_file:
              index = json.load(input_file)
          releases = [release for release in index.get("releases", []) if release.get("version") == version]
          if not releases:
              raise SystemExit(f"release {version} is missing from the download index")
          PY
          python3 - "${{ github.workspace }}/dist/releases/${{ steps.detect.outputs.version }}/stable/manifest.json" \
            "$download_base_url" <<'PY'
          import hashlib
          import json
          import sys
          import urllib.request

          manifest_path, base_url = sys.argv[1], sys.argv[2].rstrip("/")
          with open(manifest_path, encoding="utf-8") as input_file:
              manifest = json.load(input_file)
          for artifact in manifest["artifacts"]:
              with urllib.request.urlopen(artifact["url"], timeout=60) as response:
                  remote_digest = hashlib.sha256(response.read()).hexdigest()
              if remote_digest != artifact["sha256"]:
                  raise SystemExit(f"checksum mismatch: {artifact['url']}")
          print(f"verified {len(manifest['artifacts'])} download artifacts")
          PY

      - name: Publish GitHub release
        if: steps.detect.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.detect.outputs.tag }}
          RELEASE_VERSION: ${{ steps.detect.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/github-assets/* \
            --target "$GITHUB_SHA" \
            --title "如此萌屋平台 $RELEASE_VERSION" \
            --notes-file release-notes.md
