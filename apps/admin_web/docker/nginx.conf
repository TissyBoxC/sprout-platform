# Static host for the admin console bundle.
#
# The console and API share one browser origin. Nginx proxies /api to
# device_platform so production does not depend on cross-origin requests.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Build output is immutable per release; only index.html may change.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Resolve at request time instead of pinning the container IP when nginx
    # starts. Docker may assign device_platform a new address after restart.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $device_platform_upstream device_platform;
        proxy_pass http://$device_platform_upstream:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue Router uses history mode, so unknown paths must return the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never leak the server version to clients.
    server_tokens off;
}
