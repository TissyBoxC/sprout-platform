openapi: 3.0.3
info:
  title: 芽系列·初芽 Device Platform API
  version: 1.0.0
security:
  - serviceToken: []
paths:
  /healthz:
    get:
      summary: Check service health
      security: []
      responses:
        "200":
          description: Service is healthy
  /readyz:
    get:
      summary: Check service readiness
      security: []
      responses:
        "200":
          description: Service is ready
  /internal/v1/runtime:
    get:
      summary: Read service runtime information
      responses:
        "200":
          description: Runtime information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Service authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /internal/v1/devices/{device_id}/ai-credential:
    get:
      summary: Resolve the AI credential for one bound device
      description: >
        Returns the decrypted provider key owned by the bound guardian. This
        endpoint is restricted to the internal AI relay service token and must
        never be exposed to guardians, administrators, or firmware clients.
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      responses:
        "200":
          description: Device AI credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Service authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "404":
          description: Device or credential not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /internal/v1/parent-policies:
    get:
      summary: Resolve the effective parent policy for one family
      description: >
        Returns the same most-restrictive policy snapshot the device runtime
        serves. The endpoint is restricted to service tokens and never exposes
        child identities or per-child policy rows.
      parameters:
        - name: family_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Effective parent policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveParentPolicyEnvelope"
        "400":
          description: Missing family identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Service authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "404":
          description: Family policy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /api/v1/family/members:
    get:
      summary: List the members of the authenticated guardian's family
      security:
        - userToken: []
      responses:
        "200":
          description: Family members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMembersEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FamilyNotFound"
        "500":
          $ref: "#/components/responses/FamilyServiceError"
  /api/v1/family/members/{user_id}:
    put:
      summary: Change one family member's role
      description: >
        Only the family owner may change a member's role. A family must always
        keep exactly one owner, so demoting the last owner is rejected.
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyMemberRoleRequest"
      responses:
        "200":
          description: Updated family member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMemberEnvelope"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FamilyNotFound"
        "409":
          $ref: "#/components/responses/FamilyConflict"
        "422":
          $ref: "#/components/responses/FamilyUnprocessable"
        "500":
          $ref: "#/components/responses/FamilyServiceError"
    delete:
      summary: Remove one member from the authenticated guardian's family
      description: >
        Only the family owner may remove another member. Removing the last
        owner is rejected.
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyRemovedEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FamilyNotFound"
        "409":
          $ref: "#/components/responses/FamilyConflict"
        "422":
          $ref: "#/components/responses/FamilyUnprocessable"
        "500":
          $ref: "#/components/responses/FamilyServiceError"
  /api/v1/family/invitations:
    get:
      summary: List every invitation belonging to the authenticated family
      security:
        - userToken: []
      responses:
        "200":
          description: Family invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyInvitationsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FamilyNotFound"
        "500":
          $ref: "#/components/responses/FamilyServiceError"
    post:
      summary: Invite one account into the authenticated family
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyInvitationRequest"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyInvitationEnvelope"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FamilyNotFound"
        "409":
          $ref: "#/components/responses/FamilyConflict"
        "422":
          $ref: "#/components/responses/FamilyUnprocessable"
        "500":
          $ref: "#/components/responses/FamilyServiceError"
  /api/v1/family/invitations/mine:
    get:
      summary: List pending invitations addressed to the authenticated account
      description: >
        Reachable by any signed-in account, including one that is not yet a
        member of a family, so an invitee can discover and accept an invitation
        without already knowing the family id.
      security:
        - userToken: []
      responses:
        "200":
          description: Pending invitations for the authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyInvitationsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/FamilyUnprocessable"
        "500":
          $ref: "#/components/responses/FamilyServiceError"
  /api/v1/family/invitations/{invitation_id}:
    delete:
      summary: Revoke a pending invitation
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200":
          description: Invitation revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyRevokedEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FamilyNotFound"
        "409":
          $ref: "#/components/responses/FamilyConflict"
        "422":
          $ref: "#/components/responses/FamilyUnprocessable"
        "500":
          $ref: "#/components/responses/FamilyServiceError"
  /api/v1/families/{family_id}/invitations/{invitation_id}/accept:
    post:
      summary: Accept a pending invitation addressed to the authenticated account
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200":
          description: Invitation accepted and membership created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMemberEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FamilyNotFound"
        "409":
          $ref: "#/components/responses/FamilyConflict"
        "422":
          $ref: "#/components/responses/FamilyUnprocessable"
        "500":
          $ref: "#/components/responses/FamilyServiceError"
  /api/v1/family/capability:
    get:
      summary: Read the authenticated family's membership summary
      security:
        - userToken: []
      responses:
        "200":
          description: Family membership summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyCapabilityEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FamilyNotFound"
        "500":
          $ref: "#/components/responses/FamilyServiceError"
  /api/v1/children:
    get:
      summary: List the child profiles owned by the authenticated family
      security:
        - userToken: []
      responses:
        "200":
          description: Child profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildrenEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ChildServiceError"
    post:
      summary: Create a child profile
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildProfileRequest"
      responses:
        "201":
          description: Child profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildEnvelope"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ChildUnprocessable"
        "500":
          $ref: "#/components/responses/ChildServiceError"
  /api/v1/children/{child_id}:
    put:
      summary: Update a child profile
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/ChildId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChildProfileRequest"
      responses:
        "200":
          description: Child profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildEnvelope"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ChildNotFound"
        "422":
          $ref: "#/components/responses/ChildUnprocessable"
        "500":
          $ref: "#/components/responses/ChildServiceError"
    delete:
      summary: Delete a child profile
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/ChildId"
      responses:
        "200":
          description: Child profile deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildDeletedEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ChildNotFound"
        "500":
          $ref: "#/components/responses/ChildServiceError"
  /api/v1/children/{child_id}/policy:
    get:
      summary: Read one child's parent policy
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/ChildId"
      responses:
        "200":
          description: Parent policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentPolicyEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ChildNotFound"
        "500":
          $ref: "#/components/responses/ChildServiceError"
    put:
      summary: Update one child's parent policy with optimistic concurrency
      description: >
        The request must carry the policy version the guardian last read. A
        stale version is rejected with 409 version_conflict so two guardians
        cannot silently overwrite each other.
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/ChildId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParentPolicyRequest"
      responses:
        "200":
          description: Parent policy updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentPolicyEnvelope"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ChildNotFound"
        "409":
          description: Policy version conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "422":
          $ref: "#/components/responses/ChildUnprocessable"
        "500":
          $ref: "#/components/responses/ChildServiceError"
  /api/v1/auth/register:
    post:
      summary: Register a guardian account and bootstrap its family
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Guardian account and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionEnvelope"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "409":
          description: Phone or email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "422":
          $ref: "#/components/responses/AuthUnprocessable"
        "500":
          $ref: "#/components/responses/AuthServiceError"
  /api/v1/auth/login:
    post:
      summary: Sign a guardian in with phone or email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated guardian session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionEnvelope"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "403":
          description: Account or email login disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "500":
          $ref: "#/components/responses/AuthServiceError"
  /api/v1/auth/phone-verification:
    post:
      summary: Send a short-lived phone verification code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneVerificationRequest"
      responses:
        "200":
          description: Verification request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneVerificationEnvelope"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "422":
          $ref: "#/components/responses/AuthUnprocessable"
        "503":
          description: SMS verification provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "500":
          $ref: "#/components/responses/AuthServiceError"
  /api/v1/auth/refresh:
    post:
      summary: Rotate a refresh token and issue a new session pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Refreshed session pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPairEnvelope"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AuthServiceError"
  /api/v1/auth/logout:
    post:
      summary: Revoke one refresh session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutEnvelope"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AuthServiceError"
  /api/v1/auth/email:
    put:
      summary: Bind a recovery email to the authenticated guardian account
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindEmailRequest"
      responses:
        "200":
          description: Updated guardian account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEnvelope"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "422":
          $ref: "#/components/responses/AuthUnprocessable"
        "500":
          $ref: "#/components/responses/AuthServiceError"
  /api/v1/auth/profile:
    put:
      summary: Update guardian-editable profile fields
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated guardian account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEnvelope"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/AuthUnprocessable"
        "500":
          $ref: "#/components/responses/AuthServiceError"
  /api/v1/auth/overview:
    get:
      summary: Read the authenticated guardian's home dashboard counters
      security:
        - userToken: []
      responses:
        "200":
          description: Guardian dashboard counters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentOverviewEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/AuthServiceError"
  /api/v1/auth/me:
    get:
      summary: Read the authenticated guardian account and AI account summary
      security:
        - userToken: []
      responses:
        "200":
          description: Authenticated guardian account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "500":
          $ref: "#/components/responses/AuthServiceError"
  /api/v1/auth/ai-models:
    put:
      summary: Select the guardian's allowed AI models
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAIModelsRequest"
      responses:
        "200":
          description: Updated AI account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIAccountEnvelope"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: AI account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "422":
          description: Selected model is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "502":
          description: AI provider unavailable or rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "500":
          $ref: "#/components/responses/AuthServiceError"
  /api/v1/admin/auth/login:
    post:
      summary: Start an administrator login and require MFA
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: MFA challenge issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginChallengeEnvelope"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "403":
          description: Account disabled or not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "503":
          description: Administrator MFA is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "500":
          $ref: "#/components/responses/AuthServiceError"
  /api/v1/admin/auth/mfa:
    post:
      summary: Complete an administrator login with an MFA code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMFARequest"
      responses:
        "200":
          description: Authenticated administrator session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionEnvelope"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Invalid, expired, or consumed MFA challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "500":
          $ref: "#/components/responses/AuthServiceError"
  /api/v1/admin/permissions:
    get:
      summary: List administrators and the assignable permission catalog
      security:
        - userToken: []
      responses:
        "200":
          description: Administrator permission catalog and accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPermissionCatalogEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Permission service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "500":
          $ref: "#/components/responses/AuthServiceError"
  /api/v1/admin/permissions/{account_id}:
    put:
      summary: Replace one administrator's permission set
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPermissionUpdateRequest"
      responses:
        "200":
          description: Administrator permission set updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPermissionAccountEnvelope"
        "400":
          description: Malformed request body or missing account id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
