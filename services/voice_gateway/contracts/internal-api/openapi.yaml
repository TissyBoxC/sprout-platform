openapi: 3.0.3
info:
  title: 芽系列·初芽 Voice Gateway Internal API
  version: 1.0.0
security:
  - serviceToken: []
paths:
  /healthz:
    get:
      summary: Check service health
      security: []
      responses:
        "200":
          description: Service is healthy
  /readyz:
    get:
      summary: Check service readiness
      security: []
      responses:
        "200":
          description: Service is ready
  /internal/v1/runtime:
    get:
      summary: Read service runtime information
      responses:
        "200":
          description: Runtime information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Service authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /internal/v1/voice/quality:
    get:
      summary: Read bounded preprocessing quality for active voice sessions
      description: Returns only scalar AEC, noise, AGC, and VAD metrics. It never returns PCM, audio, recognized text, or provider payloads.
      responses:
        "200":
          description: Active session quality snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Service authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /internal/v1/care-view/sessions/{session_id}/stream:
    post:
      summary: Authorize and open one guardian live camera view
      description: "Called by device_platform after the device confirmed its visible and
        audible indication. The gateway re-reads the authoritative session state from
        device_platform and refuses any session that is not streaming, so a requested
        session can never start carrying frames. The parent application then connects to
        stream_path with its own guardian credential; the path carries no token. Frames
        are relayed live and are never written to disk or to a log. A session that
        already has an open stream is reused rather than duplicated."
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - device_id
                - device_token
              properties:
                device_id:
                  type: string
                  pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
                device_token:
                  type: string
                  description: Short-lived device credential. Never logged or returned.
      responses:
        "200":
          description: Stream authorized and open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareViewStreamEnvelope"
        "400":
          description: Malformed request body or identifier (care_view_invalid_request)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Service authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "404":
          description: Unknown session or device (care_view_session_not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "409":
          description: Session is not streaming (care_view_not_active)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "410":
          description: Session deadline has passed (care_view_expired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "429":
          description: Gateway stream capacity exhausted (care_view_limit_reached)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "503":
          description: Device not connected or platform unavailable (care_view_unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /v1/care-view/{session_id}:
    get:
      summary: Guardian live camera view WebSocket (binary frames)
      description: "Parent-facing upgrade path. Requires an already authorized stream and an
        active, unoccupied guardian connection. The relay re-reads the platform state while
        frames flow and closes both sides on the first hangup, on the earlier of the
        configured duration cap and the platform deadline, and when the platform stops
        reporting streaming. Text messages carry only content-free control (hangup, ping,
        pong). Failure to attach is answered as an error envelope before the upgrade:
        invalid identifiers are care_view_relay_invalid (400), an unknown or unauthorized
        session is care_view_session_not_found (404), a session that is no longer streaming
        is care_view_not_active (409), and a second parent connection is
        care_view_session_occupied (409)."
      security: []
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
        - name: device_id
          in: query
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
      responses:
        "101":
          description: Upgraded to a WebSocket that carries binary frames
        "400":
          description: Invalid identifiers (care_view_relay_invalid)
        "404":
          description: Unknown, unauthorized, or ended session (care_view_session_not_found)
        "409":
          description: Not streaming (care_view_not_active) or already occupied (care_view_session_occupied)
  /internal/v1/intercom/sessions/{session_id}/relay:
    post:
      summary: Authorize and open one guardian intercom relay
      description: "Called by device_platform after the child accepted the call. The
        gateway re-reads the authoritative call state from device_platform and
        refuses any call that is not active, so a ringing call can never start
        carrying audio. A call that already has an open relay is reused rather
        than duplicated."
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - device_id
                - device_token
              properties:
                session_id:
                  type: string
                  description: Optional; when present it must equal the path value.
                device_id:
                  type: string
                device_token:
                  type: string
                  description: Short-lived device credential. Never logged.
      responses:
        "200":
          description: Relay authorized and open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntercomRelayEnvelope"
        "400":
          description: Malformed request body (intercom_invalid_request)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Service authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "404":
          description: Unknown call or device (intercom_session_not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "409":
          description: Call is not active (intercom_session_not_active) or its deadline
            has passed (intercom_session_expired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "410":
          description: Call deadline has passed (intercom_session_expired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "422":
          description: Invalid identifiers (intercom_invalid_request)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "429":
          description: Gateway relay capacity exhausted (intercom_limit_reached)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "503":
          description: Device not connected or platform unavailable (intercom_unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /internal/v1/vision/tasks:
    post:
      summary: Run one bounded camera/vision task
      description: Accepts symbolic task metadata only. Image bytes and raw pixels
        are never accepted, stored, or logged; results carry bounded labels and a
        short summary with a 24-hour retention window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisionTaskRequest"
      responses:
        "200":
          description: Bounded vision result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Service authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "422":
          description: Invalid or unsafe vision task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "503":
          description: Vision model temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /internal/v1/vision/results/{task_id}:
    get:
      summary: Read one short-lived vision result
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$"
        - name: device_id
          in: query
          required: true
          description: Owning device of the result. The lookup is scoped to this
            device so one device cannot read another device's result.
          schema:
            type: string
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$"
      responses:
        "200":
          description: Bounded vision result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Service authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "404":
          description: Result not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: service-token
  schemas:
    VisionTaskRequest:
      type: object
      additionalProperties: false
      required:
        - task_id
        - device_id
        - task_type
      properties:
        task_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$"
        device_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$"
        task_type:
          type: string
          enum:
            - object_recognition
            - picture_book_recognition
            - photo_qa
            - capture
        policy_version:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9_.-]+$"
          description: Effective child-safety policy revision supplied by the
            trusted gateway caller and forwarded to the platform proxy.
        prompt:
          type: string
          maxLength: 500
        frame_width:
          type: integer
          minimum: 0
          maximum: 4096
        frame_height:
          type: integer
          minimum: 0
          maximum: 4096
        frame_bytes:
          type: integer
          minimum: 0
          maximum: 8388608
    IntercomRelayEnvelope:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - request_id
        - data
        - error
      properties:
        schema_version:
          type: string
          const: 1.0.0
        request_id:
          type: string
        data:
          $ref: "#/components/schemas/IntercomRelay"
        error:
          type: "null"
    IntercomRelay:
      type: object
      additionalProperties: false
      required:
        - session_id
        - device_id
        - state
        - relay_path
        - expires_at
        - max_duration_seconds
      properties:
        session_id:
          type: string
        device_id:
          type: string
        state:
          type: string
          const: active
        relay_path:
          type: string
          description: Guardian WebSocket route. It carries no credential.
        expires_at:
          type: string
          format: date-time
        max_duration_seconds:
          type: integer
          minimum: 1
          maximum: 600
    CareViewStreamEnvelope:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - request_id
        - data
        - error
      properties:
        schema_version:
          type: string
          const: 1.0.0
        request_id:
          type: string
        data:
          $ref: "#/components/schemas/CareViewStream"
        error:
          type: "null"
    CareViewStream:
      type: object
      additionalProperties: false
      required:
        - session_id
        - device_id
        - state
        - stream_path
        - expires_at
        - max_fps
      properties:
        session_id:
          type: string
        device_id:
          type: string
        state:
          type: string
          const: streaming
        stream_path:
          type: string
          description: Guardian WebSocket route. It carries no credential.
        expires_at:
          type: string
          format: date-time
          description: The earlier of the gateway duration cap and the platform
            session deadline. The relay closes both sides at this instant.
        max_fps:
          type: integer
          minimum: 1
          maximum: 30
          description: Frames per second the relay accepts from the guardian.
    ResponseEnvelope:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - request_id
        - data
        - error
      properties:
        schema_version:
          type: string
          const: 1.0.0
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        data:
          type: object
          nullable: true
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{2,63}$"
        message:
          type: string
          minLength: 1
          maxLength: 256
        retryable:
          type: boolean
