openapi: 3.1.0
info:
  title: Sprout device runtime API
  version: 1.0.0
  description: |
    Device heartbeat, parent runtime status, and administrator maintenance
    commands. All session and administrator endpoints use the platform's
    normal bearer-token authentication.
servers:
  - url: https://api.clarkhub.cn
paths:
  /api/v1/devices/{device_id}/runtime/heartbeat:
    post:
      operationId: recordDeviceHeartbeat
      summary: Record an authenticated device heartbeat
      description: |
        The device session token identifies the owner. The path device id must
        match that owner. A repeated heartbeat id is accepted idempotently.
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/device_runtime.schema.json'
      responses:
        '200':
          description: Current runtime state after the heartbeat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/devices/{device_id}/runtime/commands:
    get:
      operationId: listPendingDeviceCommands
      summary: List pending maintenance commands for the authenticated device
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '200':
          description: Commands awaiting acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/devices/{device_id}/runtime/commands/{command_id}/ack:
    post:
      operationId: acknowledgeDeviceCommand
      summary: Acknowledge a device maintenance command
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/DeviceID'
        - $ref: '#/components/parameters/CommandID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - status
                - result_code
              properties:
                status:
                  type: string
                  enum:
                    - acknowledged
                    - failed
                result_code:
                  type: string
                  maxLength: 128
      responses:
        '200':
          description: The command was acknowledged exactly once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/devices/{device_id}/ota:
    get:
      operationId: getDeviceFirmwareUpdate
      summary: Read the firmware update state for an authenticated device
      description: |
        The device session token identifies the owner and the path device id
        must match that owner. The response contains the same immutable
        release manifest the device will verify before downloading.
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '200':
          description: Current firmware update state and available release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceOtaEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/devices/{device_id}/ota/events:
    post:
      operationId: recordDeviceOtaEvent
      summary: Record one idempotent firmware update event
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/ota_device_event.schema.json'
      responses:
        '200':
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtaEventAcceptedEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/devices/{device_id}/ota/install:
    post:
      operationId: startDeviceFirmwareUpdate
      summary: Ask one guardian-owned device to start the offered firmware update
      security:
        - parentSession: []
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                deployment_id:
                  type: string
                  maxLength: 128
      responses:
        '202':
          description: Update accepted for the device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceOtaEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/devices/{device_id}/ota/status:
    get:
      operationId: getGuardianDeviceFirmwareUpdateStatus
      summary: Read firmware update progress for one guardian-owned device
      security:
        - parentSession: []
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '200':
          description: Current firmware update progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceOtaEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/devices/{device_id}/ota/retry:
    post:
      operationId: retryDeviceFirmwareUpdate
      summary: Retry a failed firmware update for one guardian-owned device
      security:
        - parentSession: []
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '202':
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceOtaEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/devices/{device_id}/ota/rollback:
    post:
      operationId: rollbackDeviceFirmwareUpdate
      summary: Request rollback to the last verified firmware for one device
      security:
        - parentSession: []
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '202':
          description: Rollback accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceOtaEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/devices/{device_id}/runtime/parent-policy:
    get:
      operationId: getEffectiveDeviceParentPolicy
      summary: Read the effective guardian policy for an authenticated device
      description: |
        Resolves the device session owner and returns one conservative policy
        aggregated from every child profile in that guardian account. The
        response never exposes child identifiers. A device bound to a family
        with no child policies receives parent_policy_not_found.
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '200':
          description: Effective family policy for the device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveParentPolicyEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/devices/{device_id}/runtime/usage:
    post:
      operationId: recordDeviceUsage
      summary: Upload one device-local usage day
      description: |
        The device session token identifies the owner; the path device id must
        match that owner. Uploads are idempotent per device and report date, so
        an offline backfill or retry replaces the same day instead of double
        counting. The payload contains only counters and durations and never
        carries conversation text, audio, images, tokens, or child data.
      security:
        - deviceSession: []
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/device_usage_upload.schema.json'
      responses:
        '200':
          description: The usage day was stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageUploadEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/usage-reports:
    get:
      operationId: listGuardianUsageReports
      summary: List usage report days for the signed-in guardian
      description: |
        Usage is attributed to the family-bound device rather than an
        individual child, because a device is paired to the guardian account
        and runs the most-restrictive policy shared across every child. Each
        day therefore includes the per-device breakdown.
      security:
        - parentSession: []
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        '200':
          description: Usage report days newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageReportListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/families/{parent_account_id}/usage-reports:
    get:
      operationId: listAdminFamilyUsageReports
      summary: List usage report days for one family for support staff
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/ParentAccountID'
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        '200':
          description: Usage report days newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageReportListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/devices/status:
    get:
      operationId: listParentDeviceStatuses
      summary: List runtime status for the signed-in guardian
      security:
        - parentSession: []
      responses:
        '200':
          description: Guardian-owned device statuses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatusListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/devices/{device_id}/status:
    get:
      operationId: getParentDeviceStatus
      summary: Read one guardian-owned device status
      security:
        - parentSession: []
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '200':
          description: Current device runtime status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatusEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/devices:
    get:
      operationId: listAdminDeviceStatuses
      summary: List all device runtime statuses for operations staff
      security:
        - adminSession: []
      responses:
        '200':
          description: All device statuses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatusListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/devices/{device_id}/commands:
    post:
      operationId: createAdminDeviceCommand
      summary: Queue a maintenance command for one device
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - command_type
              properties:
                command_type:
                  type: string
                  enum:
                    - refresh_configuration
                    - reconnect_network
                    - resync_time
                    - factory_reset
      responses:
        '201':
          description: Command queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/ota/releases:
    get:
      operationId: listAdminOtaReleases
      summary: List immutable firmware OTA releases
      security:
        - adminSession: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - draft
              - published
              - paused
              - withdrawn
        - name: channel
          in: query
          schema:
            type: string
            enum:
              - stable
              - canary
              - internal
        - name: version
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Firmware release page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtaReleasePageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAdminOtaRelease
      summary: Create an immutable firmware release draft
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtaReleaseMutation'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtaReleaseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/admin/ota/releases/{release_id}:
    get:
      operationId: getAdminOtaRelease
      summary: Read one firmware release and its deployment summary
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/OtaReleaseID'
      responses:
        '200':
          description: Firmware release detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtaReleaseDetailEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateAdminOtaRelease
      summary: Update a firmware release draft using optimistic concurrency
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/OtaReleaseID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtaReleaseMutation'
      responses:
        '200':
          description: Draft updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtaReleaseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/admin/ota/releases/{release_id}/publish:
    post:
      operationId: publishAdminOtaRelease
      summary: Publish a firmware release after signature and artifact validation
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/OtaReleaseID'
      responses:
        '200':
          description: Release published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtaReleaseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/admin/ota/releases/{release_id}/pause:
    post:
      operationId: pauseAdminOtaRelease
      summary: Pause new offers for a firmware release
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/OtaReleaseID'
      responses:
        '200':
          description: Release paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtaReleaseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/ota/releases/{release_id}/withdraw:
    post:
      operationId: withdrawAdminOtaRelease
      summary: Withdraw a firmware release from all future offers
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/OtaReleaseID'
      responses:
        '200':
          description: Release withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtaReleaseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/ota/releases/{release_id}/rollback:
    post:
      operationId: rollbackAdminOtaRelease
      summary: Start a controlled rollback for devices assigned to a release
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/OtaReleaseID'
      responses:
        '202':
          description: Rollback operation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtaReleaseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/admin/ota/releases/{release_id}/deployments:
    get:
      operationId: listAdminOtaDeployments
      summary: List device-level state for one firmware release
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/OtaReleaseID'
        - name: status
          in: query
          schema:
            type: string
            enum:
              - queued
              - offered
              - downloading
              - validating
              - installing
              - pending_verify
              - succeeded
              - failed
              - rolled_back
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Deployment page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtaDeploymentPageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/ota/deployments/{deployment_id}/retry:
    post:
      operationId: retryAdminOtaDeployment
      summary: Retry one failed device firmware deployment
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/OtaDeploymentID'
      responses:
        '202':
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtaDeploymentEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/ota/statistics:
    get:
      operationId: getAdminOtaStatistics
      summary: Read OTA release, deployment, failure, and rollback statistics
      security:
        - adminSession: []
      responses:
        '200':
          description: OTA statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtaStatisticsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/devices/{device_id}/diagnostics:
    get:
      operationId: getAdminDeviceDiagnostics
      summary: Read bounded boot, failure, recovery, and interaction diagnostics
      description: |
        Returns the newest bounded diagnostic history for one device. The
        endpoint is administrator-only and never returns credentials, media,
        child content, or provider payloads. Interaction events include wake,
        button, indicator, and factory-reset outcomes but never raw audio or
        free text. Devices running older firmware report an empty history with
        an unknown health state instead of an error.
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/DeviceID'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Bounded diagnostic history for the device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDiagnosticsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/families/{parent_account_id}/devices/{device_id}:
    delete:
      operationId: unbindAdminFamilyDevice
      summary: Unbind one device from a family
      description: |
        Removes the guardian-device binding and revokes all active device
        sessions. The parent account id is part of the lookup so an operator
        cannot unbind an unrelated device by guessing its id.
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/ParentAccountID'
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '200':
          description: Device unbound
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required:
                          - unbound
                        properties:
                          unbound:
                            type: boolean
                            const: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/admin/devices/{device_id}/commands:
    get:
      operationId: listAdminDeviceCommands
      summary: List recent maintenance commands for one device
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/DeviceID'
      responses:
        '200':
          description: Recent commands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    parentSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
    deviceSession:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    DeviceID:
      name: device_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(?:_[a-z0-9]+){1,7}$'
    ParentAccountID:
      name: parent_account_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommandID:
      name: command_id
      in: path
      required: true
      schema:
        oneOf:
          - type: string
            format: uuid
          - type: string
            pattern: '^[a-z][a-z0-9]*(?:_[a-z0-9]+){1,7}$'
    OtaReleaseID:
      name: release_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(?:_[a-z0-9]+){1,7}$'
    OtaDeploymentID:
      name: deployment_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9]*(?:_[a-z0-9]+){1,7}$'
  schemas:
    RuntimeEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RuntimeStatus'
    UsageUploadEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - report_date
                - updated_at
              properties:
                report_date:
                  type: string
                  format: date
                updated_at:
                  type: string
                  format: date-time
    UsageReportListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required:
                - reports
              properties:
                reports:
                  type: array
                  items:
                    $ref: '../schemas/usage_report.schema.json'
    EffectiveParentPolicyEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '../schemas/parent_policy_effective.schema.json'
    DeviceStatusEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeviceStatus'
    DeviceStatusListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required:
                - devices
              properties:
                devices:
                  type: array
                  items:
                    $ref: '#/components/schemas/DeviceStatus'
    DeviceDiagnosticsEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeviceDiagnostics'
    DeviceOtaEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '../schemas/ota_device_update.schema.json'
    OtaEventAcceptedEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - accepted
              properties:
                accepted:
                  type: boolean
                duplicate:
                  type: boolean
    OtaReleaseEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '../schemas/ota_release.schema.json'
    OtaReleasePageEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - releases
                - total
                - page
                - page_size
              properties:
                releases:
                  type: array
                  items:
                    $ref: '../schemas/ota_release.schema.json'
                total:
                  type: integer
                  minimum: 0
                page:
                  type: integer
                  minimum: 1
                page_size:
                  type: integer
                  minimum: 1
    OtaReleaseDetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - release
                - versions
                - rollback
              properties:
                release:
                  $ref: '../schemas/ota_release.schema.json'
                versions:
                  type: array
                  items:
                    $ref: '../schemas/ota_release.schema.json'
                rollback:
                  type: object
                  additionalProperties: false
                  required:
                    - allowed
                    - target_version
                  properties:
                    allowed:
                      type: boolean
                    target_version:
                      type: string
    OtaReleaseMutation:
      type: object
      additionalProperties: false
      required:
        - firmware_version
        - hardware_revision
        - channel
        - artifact_key
        - artifact_url
        - sha256
        - size_bytes
        - signature_key_id
        - signature_algorithm
        - signature
        - rollback_allowed
        - min_source_version
        - release_notes
      properties:
        firmware_version:
          type: string
        hardware_revision:
          type: string
        channel:
          type: string
          enum:
            - stable
            - canary
            - internal
        artifact_key:
          type: string
        artifact_url:
          type: string
          format: uri
          pattern: ^https://
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        size_bytes:
          type: integer
          minimum: 1
          maximum: 16777216
        signature_key_id:
          type: string
        signature_algorithm:
          type: string
          enum:
            - ed25519
        signature:
          type: string
        signature_status:
          type: string
          enum:
            - pending
            - verified
            - failed
            - missing
        signature_verified_at:
          type: string
          format: date-time
        mandatory:
          type: boolean
        rollback_allowed:
          type: boolean
        min_source_version:
          type: string
        release_notes:
          type: string
          maxLength: 4000
        target_type:
          type: string
          enum:
            - all
            - device
            - group
            - canary
        target_id:
          type: string
          maxLength: 128
        canary_percent:
          type: integer
          minimum: 0
          maximum: 100
        expected_version:
          type: integer
          minimum: 1
    OtaDeploymentEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/OtaDeployment'
    OtaDeploymentPageEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - deployments
                - total
                - page
                - page_size
              properties:
                deployments:
                  type: array
                  items:
                    $ref: '#/components/schemas/OtaDeployment'
                total:
                  type: integer
                  minimum: 0
                page:
                  type: integer
                  minimum: 1
                page_size:
                  type: integer
                  minimum: 1
    OtaDeployment:
      type: object
      additionalProperties: false
      required:
        - deployment_id
        - release_id
        - device_id
        - status
        - progress_percent
        - created_at
      properties:
        deployment_id:
          type: string
        release_id:
          type: string
        device_id:
          type: string
        device_name:
          type: string
        hardware_revision:
          type: string
        status:
          type: string
          enum:
            - queued
            - offered
            - downloading
            - validating
            - installing
            - pending_verify
            - succeeded
            - failed
            - rolled_back
        progress_percent:
          type: number
          minimum: 0
          maximum: 100
        error_code:
          type: string
        error_message:
          type: string
        retry_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
    OtaStatisticsEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/OtaStatistics'
    OtaStatistics:
      type: object
      additionalProperties: false
      required:
        - published_release_count
        - canary_release_count
        - active_deployment_count
        - succeeded_deployment_count
        - failed_deployment_count
        - rollback_count
        - failure_rate
        - rollback_rate
      properties:
        published_release_count:
          type: integer
          minimum: 0
        canary_release_count:
          type: integer
          minimum: 0
        active_deployment_count:
          type: integer
          minimum: 0
        succeeded_deployment_count:
          type: integer
          minimum: 0
        failed_deployment_count:
          type: integer
          minimum: 0
        rollback_count:
          type: integer
          minimum: 0
        failure_rate:
          type: number
          minimum: 0
          maximum: 1
        rollback_rate:
          type: number
          minimum: 0
          maximum: 1
    DeviceDiagnostics:
      type: object
      additionalProperties: false
      required:
        - device_id
        - boot_events
        - failures
        - recovery_events
        - interaction_events
        - latest_failure
        - error_count
        - recovery_count
        - health_state
      properties:
        device_id:
          type: string
        boot_events:
          type: array
          items:
            $ref: '#/components/schemas/BootEvent'
        failures:
          type: array
          items:
            $ref: '#/components/schemas/ModuleFailure'
        recovery_events:
          type: array
          items:
            $ref: '#/components/schemas/RecoveryEvent'
        interaction_events:
          type: array
          items:
            $ref: '#/components/schemas/InteractionEvent'
        latest_failure:
          oneOf:
            - $ref: '#/components/schemas/ModuleFailure'
            - type: 'null'
        error_count:
          type: integer
          minimum: 0
        recovery_count:
          type: integer
          minimum: 0
        updated_at:
          type: string
          format: date-time
        health_state:
          type: string
          enum:
            - healthy
            - degraded
            - faulted
            - unknown
        retention_boot_events:
          type: integer
          minimum: 1
        retention_failures:
          type: integer
          minimum: 1
        retention_recovery_events:
          type: integer
          minimum: 1
        retention_interaction_events:
          type: integer
          minimum: 1
    InteractionEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - event_type
        - sequence
        - detail_code
        - duration_ms
        - firmware_version
        - reported_at
      properties:
        event_id:
          type: string
        event_type:
          type: string
          enum:
            - wake_detected
            - wake_rejected
            - button_gesture
            - indicator_state
            - factory_reset_requested
            - factory_reset_cancelled
            - factory_reset_completed
            - factory_reset_failed
        sequence:
          type: integer
          minimum: 1
        detail_code:
          type: string
          pattern: '^[A-Za-z0-9_.:-]{1,64}$'
        duration_ms:
          type: integer
          minimum: 0
          maximum: 3600000
        firmware_version:
          type: string
        reported_at:
          type: string
          format: date-time
    BootEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - event_type
        - sequence
        - uptime_ms
        - boot_count
        - reset_reason
        - firmware_version
        - reported_at
      properties:
        event_id:
          type: string
        event_type:
          type: string
          const: boot
        sequence:
          type: integer
          minimum: 1
        uptime_ms:
          type: integer
          minimum: 0
        boot_count:
          type: integer
          minimum: 1
        reset_reason:
          type: string
        firmware_version:
          type: string
        reported_at:
          type: string
          format: date-time
    ModuleFailure:
      type: object
      additionalProperties: false
      required:
        - event_id
        - event_type
        - sequence
        - module_name
        - error_code
        - failure_count
        - firmware_version
        - reported_at
      properties:
        event_id:
          type: string
        event_type:
          type: string
          const: module_failure
        sequence:
          type: integer
          minimum: 1
        module_name:
          type: string
        error_code:
          type: string
        failure_count:
          type: integer
          minimum: 1
        firmware_version:
          type: string
        reported_at:
          type: string
          format: date-time
    RecoveryEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - event_type
        - sequence
        - module_name
        - firmware_version
        - reported_at
      properties:
        event_id:
          type: string
        event_type:
          type: string
          const: module_recovered
        sequence:
          type: integer
          minimum: 1
        module_name:
          type: string
        firmware_version:
          type: string
        reported_at:
          type: string
          format: date-time
    CommandEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Command'
    CommandListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required:
                - commands
              properties:
                commands:
                  type: array
                  items:
                    $ref: '#/components/schemas/Command'
    AckEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required:
                - acknowledged
              properties:
                acknowledged:
                  type: boolean
    SuccessEnvelope:
      type: object
      required:
        - schema_version
        - request_id
        - data
      properties:
        schema_version:
          type: string
          const: 1.0.0
        request_id:
          type: string
        data: {}
    RuntimeStatus:
      $ref: '../schemas/device_runtime.schema.json'
    DeviceStatus:
      type: object
      additionalProperties: false
      required:
        - parent_account_id
        - device_id
        - device_name
        - hardware_model
        - firmware_version
        - capabilities
        - lifecycle_status
        - bound_at
        - updated_at
        - runtime
      properties:
        parent_account_id:
          type: string
          format: uuid
        device_id:
          type: string
        device_name:
          type: string
        hardware_model:
          type: string
        firmware_version:
          type: string
        capabilities:
          type: array
          items:
            type: string
        lifecycle_status:
          type: string
          enum:
            - active
        bound_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        runtime:
          oneOf:
            - $ref: '#/components/schemas/RuntimeStatus'
            - type: 'null'
    Command:
      type: object
      additionalProperties: false
      required:
        - command_id
        - device_id
        - command_type
        - status
        - created_at
      properties:
        command_id:
          type: string
        device_id:
          type: string
        command_type:
          type: string
          enum:
            - refresh_configuration
            - reconnect_network
            - resync_time
            - factory_reset
        status:
          type: string
          enum:
            - pending
            - delivered
            - acknowledged
            - failed
        request_id:
          type: string
        created_at:
          type: string
          format: date-time
        delivered_at:
          type:
            - string
            - 'null'
          format: date-time
        acknowledged_at:
          type:
            - string
            - 'null'
          format: date-time
        result_code:
          type: string
  responses:
    BadRequest:
      description: Request body is malformed
      content:
        application/json:
          schema:
            $ref: '../errors/error_response.schema.json'
    Unauthorized:
      description: Session or device token is missing or expired
      content:
        application/json:
          schema:
            $ref: '../errors/error_response.schema.json'
    Forbidden:
      description: The signed-in account has insufficient permission
      content:
        application/json:
          schema:
            $ref: '../errors/error_response.schema.json'
    NotFound:
      description: Device or command was not found
      content:
        application/json:
          schema:
            $ref: '../errors/error_response.schema.json'
    Conflict:
      description: The command was already handled
      content:
        application/json:
          schema:
            $ref: '../errors/error_response.schema.json'
    Unprocessable:
      description: Device data failed validation
      content:
        application/json:
          schema:
            $ref: '../errors/error_response.schema.json'
