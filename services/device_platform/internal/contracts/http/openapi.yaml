          $ref: "#/components/responses/DeviceServiceError"
  /api/v1/admin/image-privacy/stats:
    get:
      summary: Read the fleet-wide image-privacy summary
      security:
        - userToken: []
      parameters:
        - name: window_days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
      responses:
        "200":
          description: Image-privacy fleet statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagePrivacyAdminStatsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/DeviceServiceError"
  /api/v1/devices/{device_id}/image-privacy/policy:
    get:
      summary: Read the family image-privacy policy from a bound device
      security:
        - deviceSessionToken: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Device image-privacy policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagePrivacyPolicyRecordEnvelope"
        "401":
          $ref: "#/components/responses/DeviceSessionExpired"
        "500":
          $ref: "#/components/responses/DeviceServiceError"
  /api/v1/devices/{device_id}/image-privacy/status:
    post:
      summary: Report bounded image pipeline status from a bound device
      security:
        - deviceSessionToken: []
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImagePrivacyStatusRequest"
      responses:
        "200":
          description: Image pipeline status recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagePrivacyStatusRecordedEnvelope"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          $ref: "#/components/responses/DeviceSessionExpired"
        "422":
          $ref: "#/components/responses/DeviceUnprocessable"
        "500":
          $ref: "#/components/responses/DeviceServiceError"
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: service-token
    userToken:
      type: http
      scheme: bearer
      bearerFormat: user-access-token
    deviceSessionToken:
      type: http
      scheme: bearer
      bearerFormat: device-session-token
  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    FamilyId:
      name: family_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ChildId:
      name: child_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AccountId:
      name: account_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$"
    CommandId:
      name: command_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    DeviceMeshGroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AlarmId:
      name: alarm_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    PlaybackRequestId:
      name: request_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    EnglishLessonId:
      name: lesson_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9]*(?:_[a-z0-9]+){1,7}$"
    EnglishChildId:
      name: child_id
      in: query
      required: false
      schema:
        type: string
        maxLength: 128
    EnglishLessonIdQuery:
      name: lesson_id
      in: query
      required: false
      schema:
        type: string
        pattern: "^[a-z][a-z0-9]*(?:_[a-z0-9]+){1,7}$"
    EnglishListLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    LocalCommandId:
      name: command_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    Unauthorized:
      description: Authentication missing, expired, or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    FamilyNotFound:
      description: Family, member, or invitation not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    FamilyConflict:
      description: >
        Membership conflict: duplicate member, last owner, or invitation state
        conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    FamilyUnprocessable:
      description: Invalid or expired invitation, missing permission, or invalid member
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    FamilyServiceError:
      description: Family operation failed unexpectedly
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    ChildNotFound:
      description: Child or child policy not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    ChildUnprocessable:
      description: Invalid child profile, consent, or parent policy
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    ChildServiceError:
      description: Child or parent policy operation failed unexpectedly
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    Forbidden:
      description: Authenticated account lacks the required role or permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    AuthUnprocessable:
      description: Invalid registration, profile, phone, or password value
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    AuthServiceError:
      description: Identity operation failed unexpectedly
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    DeviceBindingNotFound:
      description: Device, binding token, or registration token not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    DeviceBindingConflict:
      description: Device, binding token, or registration token already consumed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    DeviceBindingGone:
      description: Device binding or registration token expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    DeviceAuthFailed:
      description: Device proof, nonce, or session verification failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    DeviceSessionExpired:
      description: Device session is missing, expired, or revoked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    DeviceUnprocessable:
      description: Device identity, capability, or measurement invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    DeviceServiceError:
      description: Device lifecycle operation failed unexpectedly
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    DeviceRuntimeNotFound:
      description: Device runtime or command not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
  schemas:
    ResponseEnvelope:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - request_id
        - data
        - error
      properties:
        schema_version:
          type: string
          const: 1.0.0
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        data:
          type: object
          nullable: true
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    EffectiveParentPolicyEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - policy
              properties:
                policy:
                  $ref: "#/components/schemas/EffectiveParentPolicy"
    EffectiveParentPolicy:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - policy_version
        - daily_limit_minutes
        - allowed_categories
        - disabled_periods
        - max_volume_percent
        - source_child_count
        - aggregation_mode
        - updated_at
      properties:
        schema_version:
          type: string
          const: 1.0.0
        policy_version:
          type: integer
          minimum: 1
        daily_limit_minutes:
          type: integer
          minimum: 0
          maximum: 720
        allowed_categories:
          type: array
          uniqueItems: true
          items:
            type: string
        disabled_periods:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - start_time
              - end_time
            properties:
              start_time:
                type: string
              end_time:
                type: string
        max_volume_percent:
          type: integer
          minimum: 0
          maximum: 100
        source_child_count:
          type: integer
          minimum: 1
        aggregation_mode:
          type: string
          const: most_restrictive
        updated_at:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{2,63}$"
        message:
          type: string
          minLength: 1
          maxLength: 256
        retryable:
          type: boolean
    FamilyRole:
      type: string
      enum:
        - owner
        - guardian
        - viewer
    FamilyInvitationRole:
      type: string
      enum:
        - guardian
        - viewer
    FamilyMember:
      type: object
      additionalProperties: false
      required:
        - id
        - family_id
        - user_id
        - role
        - created_at
        - updated_at
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        family_id:
          type: string
          minLength: 1
          maxLength: 128
        user_id:
          type: string
          minLength: 1
          maxLength: 128
        role:
          $ref: "#/components/schemas/FamilyRole"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FamilyInvitation:
      type: object
      additionalProperties: false
      required:
        - id
        - family_id
        - email
        - role
        - status
        - invited_by_user_id
        - created_at
        - expires_at
        - accepted_at
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        family_id:
          type: string
          minLength: 1
          maxLength: 128
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: "#/components/schemas/FamilyInvitationRole"
        status:
          type: string
          enum:
            - pending
            - accepted
            - revoked
        invited_by_user_id:
          type: string
          minLength: 1
          maxLength: 128
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true
    FamilyMemberRoleRequest:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/FamilyRole"
    FamilyInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: "#/components/schemas/FamilyInvitationRole"
    FamilyMembersEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - members
              properties:
                members:
                  type: array
                  items:
                    $ref: "#/components/schemas/FamilyMember"
    FamilyInvitationsEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - invitations
              properties:
                invitations:
                  type: array
                  items:
                    $ref: "#/components/schemas/FamilyInvitation"
    FamilyMemberEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - member
              properties:
                member:
                  $ref: "#/components/schemas/FamilyMember"
    FamilyInvitationEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - invitation
              properties:
                invitation:
                  $ref: "#/components/schemas/FamilyInvitation"
    FamilyRemovedEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - removed
              properties:
                removed:
                  type: boolean
                  const: true
    FamilyRevokedEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - revoked
              properties:
                revoked:
                  type: boolean
                  const: true
    FamilyCapability:
      type: object
      additionalProperties: false
      required:
        - family_id
        - owner_user_id
        - member_count
        - pending_invite_count
        - schema_version
      properties:
        family_id:
          type: string
          minLength: 1
          maxLength: 128
        owner_user_id:
          type: string
          minLength: 1
          maxLength: 128
        member_count:
          type: integer
          minimum: 1
        pending_invite_count:
          type: integer
          minimum: 0
        schema_version:
          type: string
          const: 1.0.0
    FamilyCapabilityEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/FamilyCapability"
    ChildProfileRequest:
      type: object
      additionalProperties: false
      required:
        - nickname
        - age_tier
        - interests
        - content_categories
        - guardian_consent
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 32
        age_tier:
          type: string
          enum:
            - age_3_4
            - age_5_6
            - age_7_8
        interests:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z][a-z0-9_]{1,31}$"
        content_categories:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        guardian_consent:
          type: boolean
    Child:
      type: object
      additionalProperties: false
      required:
        - child_id
        - family_id
        - nickname
        - age_tier
        - interests
        - content_categories
        - guardian_consent
        - guardian_consent_version
        - created_at
        - updated_at
      properties:
        child_id:
          type: string
          minLength: 1
          maxLength: 128
        family_id:
          type: string
          minLength: 1
          maxLength: 128
        nickname:
          type: string
          minLength: 1
          maxLength: 32
        age_tier:
          type: string
          enum:
            - age_3_4
            - age_5_6
            - age_7_8
        interests:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            type: string
        content_categories:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        guardian_consent:
          type: boolean
          const: true
        guardian_consent_version:
          type: string
          minLength: 1
          maxLength: 32
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChildrenEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - children
              properties:
                children:
                  type: array
                  items:
                    $ref: "#/components/schemas/Child"
    ChildEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - child
              properties:
                child:
                  $ref: "#/components/schemas/Child"
    ChildDeletedEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - deleted
              properties:
                deleted:
                  type: boolean
                  const: true
    ParentPolicyVoiceConversation:
      type: object
      additionalProperties: false
      required:
        - continuous_conversation_enabled
        - idle_window_seconds
        - barge_in_enabled
        - far_field_enabled
      properties:
        continuous_conversation_enabled:
          type: boolean
        idle_window_seconds:
          type: integer
          minimum: 2
          maximum: 60
        barge_in_enabled:
          type: boolean
        far_field_enabled:
          type: boolean
    ParentPolicyRequest:
      type: object
      additionalProperties: false
      required:
        - policy_version
        - daily_limit_minutes
        - allowed_categories
        - disabled_periods
        - max_volume_percent
        - voice_conversation
      properties:
        policy_version:
          type: integer
          minimum: 1
        daily_limit_minutes:
          type: integer
          minimum: 0
          maximum: 720
        allowed_categories:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
        disabled_periods:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/DisabledPeriod"
        max_volume_percent:
          type: integer
          minimum: 0
          maximum: 100
        voice_conversation:
          $ref: "#/components/schemas/ParentPolicyVoiceConversation"
    DisabledPeriod:
      type: object
      additionalProperties: false
      required:
        - start_time
        - end_time
      properties:
        start_time:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
        end_time:
          type: string
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
    ParentPolicy:
      type: object
      additionalProperties: false
      required:
        - policy_id
        - family_id
        - child_id
        - policy_version
        - daily_limit_minutes
        - allowed_categories
        - disabled_periods
        - max_volume_percent
        - voice_conversation
        - updated_at
      properties:
        policy_id:
          type: string
          minLength: 1
          maxLength: 128
        family_id:
          type: string
          minLength: 1
          maxLength: 128
        child_id:
          type: string
          minLength: 1
          maxLength: 128
        policy_version:
          type: integer
          minimum: 1
        daily_limit_minutes:
          type: integer
          minimum: 0
          maximum: 720
        allowed_categories:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        disabled_periods:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/DisabledPeriod"
        max_volume_percent:
          type: integer
          minimum: 0
          maximum: 100
        voice_conversation:
          $ref: "#/components/schemas/ParentPolicyVoiceConversation"
        updated_at:
          type: string
          format: date-time
    ParentPolicyEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - policy
              properties:
                policy:
                  $ref: "#/components/schemas/ParentPolicy"
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - phone
        - phone_verification_code
        - password
        - guardian_family_name
        - child_nickname
        - child_birthday
        - guardian_consent_version
      properties:
        phone:
          type: string
          pattern: "^1[0-9]{10}$"
        phone_verification_code:
          type: string
          minLength: 4
          maxLength: 12
        password:
          type: string
          minLength: 8
          maxLength: 128
        guardian_family_name:
          type: string
          minLength: 1
          maxLength: 40
        child_nickname:
          type: string
          minLength: 1
          maxLength: 40
        child_birthday:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        guardian_consent_version:
          type: string
          minLength: 1
          maxLength: 32
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    PhoneVerificationRequest:
      type: object
      additionalProperties: false
      required:
        - phone
        - purpose
      properties:
        phone:
          type: string
          pattern: "^1[0-9]{10}$"
        purpose:
          type: string
          enum:
            - register
            - login
            - reset_password
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 4096
    BindEmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required:
        - display_name
        - guardian_family_name
        - child_nickname
        - child_birthday
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 64
        guardian_family_name:
          type: string
          minLength: 1
          maxLength: 40
        child_nickname:
          type: string
          minLength: 1
          maxLength: 40
        child_birthday:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    UpdateAIModelsRequest:
      type: object
      additionalProperties: false
      required:
        - selected_models
      properties:
        selected_models:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    AdminMFARequest:
      type: object
      additionalProperties: false
      required:
        - challenge_token
        - code
      properties:
        challenge_token:
          type: string
          minLength: 1
          maxLength: 4096
        code:
          type: string
          minLength: 4
          maxLength: 12
    AdminPermissionUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - permissions
      properties:
        permissions:
