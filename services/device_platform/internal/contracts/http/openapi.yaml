openapi: 3.0.3
info:
  title: 芽系列·初芽 Device Platform API
  version: 1.0.0
security:
  - serviceToken: []
paths:
  /healthz:
    get:
      summary: Check service health
      security: []
      responses:
        "200":
          description: Service is healthy
  /readyz:
    get:
      summary: Check service readiness
      security: []
      responses:
        "200":
          description: Service is ready
  /internal/v1/runtime:
    get:
      summary: Read service runtime information
      responses:
        "200":
          description: Runtime information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Service authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /internal/v1/devices/{device_id}/ai-credential:
    get:
      summary: Resolve the AI credential for one bound device
      description: >
        Returns the decrypted provider key owned by the bound guardian. This
        endpoint is restricted to the internal AI relay service token and must
        never be exposed to guardians, administrators, or firmware clients.
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      responses:
        "200":
          description: Device AI credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Service authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "404":
          description: Device or credential not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /internal/v1/parent-policies:
    get:
      summary: Resolve the effective parent policy for one family
      description: >
        Returns the same most-restrictive policy snapshot the device runtime
        serves. The endpoint is restricted to service tokens and never exposes
        child identities or per-child policy rows.
      parameters:
        - name: family_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Effective parent policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveParentPolicyEnvelope"
        "400":
          description: Missing family identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          description: Service authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "404":
          description: Family policy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
  /api/v1/family/members:
    get:
      summary: List the members of the authenticated guardian's family
      security:
        - userToken: []
      responses:
        "200":
          description: Family members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMembersEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FamilyNotFound"
        "500":
          $ref: "#/components/responses/FamilyServiceError"
  /api/v1/family/members/{user_id}:
    put:
      summary: Change one family member's role
      description: >
        Only the family owner may change a member's role. A family must always
        keep exactly one owner, so demoting the last owner is rejected.
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyMemberRoleRequest"
      responses:
        "200":
          description: Updated family member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMemberEnvelope"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FamilyNotFound"
        "409":
          $ref: "#/components/responses/FamilyConflict"
        "422":
          $ref: "#/components/responses/FamilyUnprocessable"
        "500":
          $ref: "#/components/responses/FamilyServiceError"
    delete:
      summary: Remove one member from the authenticated guardian's family
      description: >
        Only the family owner may remove another member. Removing the last
        owner is rejected.
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyRemovedEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FamilyNotFound"
        "409":
          $ref: "#/components/responses/FamilyConflict"
        "422":
          $ref: "#/components/responses/FamilyUnprocessable"
        "500":
          $ref: "#/components/responses/FamilyServiceError"
  /api/v1/family/invitations:
    get:
      summary: List every invitation belonging to the authenticated family
      security:
        - userToken: []
      responses:
        "200":
          description: Family invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyInvitationsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FamilyNotFound"
        "500":
          $ref: "#/components/responses/FamilyServiceError"
    post:
      summary: Invite one account into the authenticated family
      security:
        - userToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyInvitationRequest"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyInvitationEnvelope"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FamilyNotFound"
        "409":
          $ref: "#/components/responses/FamilyConflict"
        "422":
          $ref: "#/components/responses/FamilyUnprocessable"
        "500":
          $ref: "#/components/responses/FamilyServiceError"
  /api/v1/family/invitations/mine:
    get:
      summary: List pending invitations addressed to the authenticated account
      description: >
        Reachable by any signed-in account, including one that is not yet a
        member of a family, so an invitee can discover and accept an invitation
        without already knowing the family id.
      security:
        - userToken: []
      responses:
        "200":
          description: Pending invitations for the authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyInvitationsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/FamilyUnprocessable"
        "500":
          $ref: "#/components/responses/FamilyServiceError"
  /api/v1/family/invitations/{invitation_id}:
    delete:
      summary: Revoke a pending invitation
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200":
          description: Invitation revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyRevokedEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FamilyNotFound"
        "409":
          $ref: "#/components/responses/FamilyConflict"
        "422":
          $ref: "#/components/responses/FamilyUnprocessable"
        "500":
          $ref: "#/components/responses/FamilyServiceError"
  /api/v1/families/{family_id}/invitations/{invitation_id}/accept:
    post:
      summary: Accept a pending invitation addressed to the authenticated account
      security:
        - userToken: []
      parameters:
        - $ref: "#/components/parameters/FamilyId"
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200":
          description: Invitation accepted and membership created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyMemberEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FamilyNotFound"
        "409":
          $ref: "#/components/responses/FamilyConflict"
        "422":
          $ref: "#/components/responses/FamilyUnprocessable"
        "500":
          $ref: "#/components/responses/FamilyServiceError"
  /api/v1/family/capability:
    get:
      summary: Read the authenticated family's membership summary
      security:
        - userToken: []
      responses:
        "200":
          description: Family membership summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyCapabilityEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/FamilyNotFound"
        "500":
          $ref: "#/components/responses/FamilyServiceError"
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: service-token
    userToken:
      type: http
      scheme: bearer
      bearerFormat: user-access-token
  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    FamilyId:
      name: family_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    Unauthorized:
      description: Authentication missing, expired, or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    FamilyNotFound:
      description: Family, member, or invitation not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    FamilyConflict:
      description: >
        Membership conflict: duplicate member, last owner, or invitation state
        conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    FamilyUnprocessable:
      description: Invalid or expired invitation, missing permission, or invalid member
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
    FamilyServiceError:
      description: Family operation failed unexpectedly
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResponseEnvelope"
  schemas:
    ResponseEnvelope:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - request_id
        - data
        - error
      properties:
        schema_version:
          type: string
          const: 1.0.0
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        data:
          type: object
          nullable: true
        error:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Error"
    EffectiveParentPolicyEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: object
              required:
                - policy
              properties:
                policy:
                  $ref: "#/components/schemas/EffectiveParentPolicy"
    EffectiveParentPolicy:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - policy_version
        - daily_limit_minutes
        - allowed_categories
        - disabled_periods
        - max_volume_percent
        - source_child_count
        - aggregation_mode
        - updated_at
      properties:
        schema_version:
          type: string
          const: 1.0.0
        policy_version:
          type: integer
          minimum: 1
        daily_limit_minutes:
          type: integer
          minimum: 0
          maximum: 720
        allowed_categories:
          type: array
          uniqueItems: true
          items:
            type: string
        disabled_periods:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - start_time
              - end_time
            properties:
              start_time:
                type: string
              end_time:
                type: string
        max_volume_percent:
          type: integer
          minimum: 0
          maximum: 100
        source_child_count:
          type: integer
          minimum: 1
        aggregation_mode:
          type: string
          const: most_restrictive
        updated_at:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]{2,63}$"
        message:
          type: string
          minLength: 1
          maxLength: 256
        retryable:
          type: boolean
    FamilyRole:
      type: string
      enum:
        - owner
        - guardian
        - viewer
    FamilyInvitationRole:
      type: string
      enum:
        - guardian
        - viewer
    FamilyMember:
      type: object
      additionalProperties: false
      required:
        - id
        - family_id
        - user_id
        - role
        - created_at
        - updated_at
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        family_id:
          type: string
          minLength: 1
          maxLength: 128
        user_id:
          type: string
          minLength: 1
          maxLength: 128
        role:
          $ref: "#/components/schemas/FamilyRole"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FamilyInvitation:
      type: object
      additionalProperties: false
      required:
        - id
        - family_id
        - email
        - role
        - status
        - invited_by_user_id
        - created_at
        - expires_at
        - accepted_at
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        family_id:
          type: string
          minLength: 1
          maxLength: 128
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: "#/components/schemas/FamilyInvitationRole"
        status:
          type: string
          enum:
            - pending
            - accepted
            - revoked
        invited_by_user_id:
          type: string
          minLength: 1
          maxLength: 128
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true
    FamilyMemberRoleRequest:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/FamilyRole"
    FamilyInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: "#/components/schemas/FamilyInvitationRole"
    FamilyMembersEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - members
              properties:
                members:
                  type: array
                  items:
                    $ref: "#/components/schemas/FamilyMember"
    FamilyInvitationsEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - invitations
              properties:
                invitations:
                  type: array
                  items:
                    $ref: "#/components/schemas/FamilyInvitation"
    FamilyMemberEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - member
              properties:
                member:
                  $ref: "#/components/schemas/FamilyMember"
    FamilyInvitationEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - invitation
              properties:
                invitation:
                  $ref: "#/components/schemas/FamilyInvitation"
    FamilyRemovedEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - removed
              properties:
                removed:
                  type: boolean
                  const: true
    FamilyRevokedEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required:
                - revoked
              properties:
                revoked:
                  type: boolean
                  const: true
    FamilyCapability:
      type: object
      additionalProperties: false
      required:
        - family_id
        - owner_user_id
        - member_count
        - pending_invite_count
        - schema_version
      properties:
        family_id:
          type: string
          minLength: 1
          maxLength: 128
        owner_user_id:
          type: string
          minLength: 1
          maxLength: 128
        member_count:
          type: integer
          minimum: 1
        pending_invite_count:
          type: integer
          minimum: 0
        schema_version:
          type: string
          const: 1.0.0
    FamilyCapabilityEnvelope:
      allOf:
        - $ref: "#/components/schemas/ResponseEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/FamilyCapability"
