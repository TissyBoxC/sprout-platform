          parsed_index = urlsplit(index_url)
          parsed_base = urlsplit(base_url)
          if (
              parsed_index.scheme != "https"
              or parsed_base.scheme != "https"
              or (parsed_index.hostname or "").lower()
              != (parsed_base.hostname or "").lower()
              or (parsed_index.port or 443) != (parsed_base.port or 443)
          ):
              raise SystemExit("download index is outside the configured origin")

          def validate_download_target(candidate, label):
              parsed = urlsplit(candidate)
              if (
                  parsed.scheme != parsed_base.scheme
                  or (parsed.hostname or "").lower() != (parsed_base.hostname or "").lower()
                  or (parsed.port or 443) != (parsed_base.port or 443)
                  or parsed.username is not None
                  or parsed.password is not None
                  or parsed.query
                  or parsed.fragment
                  or any(character in candidate for character in ("\\", "%"))
              ):
                  raise SystemExit(f"{label} is outside the configured download origin")
              if not parsed.path.startswith(parsed_base.path.rstrip("/") + "/"):
                  raise SystemExit(f"{label} is outside the configured download path")
              if any(segment in ("", ".", "..") for segment in parsed.path.split("/")[1:]):
                  raise SystemExit(f"{label} contains an unsafe path segment")
              return candidate

          class SafeRedirectHandler(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file_pointer, code, message, headers, new_url):
                  target = urllib.parse.urljoin(request.full_url, new_url)
                  validate_download_target(target, "published download redirect")
                  return super().redirect_request(
                      request, file_pointer, code, message, headers, target
                  )

          opener = urllib.request.build_opener(SafeRedirectHandler())
          validate_download_target(index_url, "download index")
          with opener.open(index_url, timeout=60) as response:
              validate_download_target(response.geturl(), "download index final target")
              payload = bytearray()
              while True:
                  chunk = response.read(64 * 1024)
                  if not chunk:
                      break
                  payload.extend(chunk)
                  if len(payload) > 4 * 1024 * 1024:
                      raise SystemExit("download index is too large")
          index = json.loads(payload.decode("utf-8"))
          matches = [
              release
              for release in index.get("releases", [])
              if isinstance(release, dict) and release.get("version") == version
          ]
          expected_manifest = f"{base_url}/{version}/stable/manifest.json"
          if len(matches) != 1 or matches[0].get("manifest_url") != expected_manifest:
              raise SystemExit("published download index does not expose the verified release")
          PY

      - name: Promote verified images
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.detect.outputs.version }}
          CANDIDATE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(echo "$REGISTRY_OWNER" | tr '[:upper:]' '[:lower:]')"
          for image in \
            sprout-device-platform \
            sprout-voice-gateway \
            sprout-admin-web \
            sprout-upgrade-worker; do
            source="ghcr.io/$owner/$image:$CANDIDATE_TAG"
            if ! docker buildx imagetools inspect "ghcr.io/$owner/$image:$RELEASE_VERSION" >/dev/null 2>&1; then
              docker buildx imagetools create \
                --tag "ghcr.io/$owner/$image:$RELEASE_VERSION" \
                "$source"
            fi
            docker buildx imagetools create \
              --tag "ghcr.io/$owner/$image:latest" \
              "ghcr.io/$owner/$image:$RELEASE_VERSION"
          done
