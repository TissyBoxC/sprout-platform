              raise SystemExit("download base URL port is out of range")
          segments = parsed.path.split("/")[1:] if parsed.path not in ("", "/") else []
          if any(segment in ("", ".", "..") for segment in segments):
              raise SystemExit("download base URL path must not contain empty or traversal segments")
          if parsed.path.endswith("/"):
              raise SystemExit("download base URL must not end with a slash")
          PY
          python3 - "${{ github.workspace }}/dist/releases/${{ steps.detect.outputs.version }}/stable/manifest.json" \
            "$download_base_url" \
            "$CANDIDATE_CHANNEL" \
            "${{ steps.detect.outputs.version }}" <<'PY'
          import hashlib
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from urllib.parse import urlsplit

          manifest_path, base_url, candidate_channel, version = sys.argv[1:5]
          base_url = base_url.rstrip("/")
          if not candidate_channel.startswith("candidate-"):
              raise SystemExit("candidate channel is not isolated")
          with open(manifest_path, encoding="utf-8") as input_file:
              payload = json.load(input_file)
          if payload.get("version") != version or payload.get("channel") != "stable":
              raise SystemExit("release manifest does not match the candidate")
          for artifact in payload.get("artifacts", []):
              artifact["url"] = (
                  f"{base_url}/{version}/{candidate_channel}/"
                  f"{artifact['relative_path']}"
              )
          manifest = payload
          parsed_base = urlsplit(base_url)
          if (
              parsed_base.scheme != "https"
              or not parsed_base.hostname
              or parsed_base.username is not None
              or parsed_base.password is not None
              or parsed_base.query
              or parsed_base.fragment
          ):
              raise SystemExit("download base URL must be a canonical HTTPS origin")
          expected_origin = (
              parsed_base.scheme,
              parsed_base.hostname.lower(),
              parsed_base.port or 443,
          )

          def validate_download_url(url, label):
              if any(ord(character) < 0x21 or ord(character) > 0x7E for character in url):
                  raise SystemExit(f"{label} must contain printable ASCII only")
              if any(character in url for character in ("?", "#", "\\", "%")):
                  raise SystemExit(f"{label} must not contain query, fragment, escape, or backslash characters")
              parsed = urlsplit(url)
              if (
                  parsed.scheme != expected_origin[0]
                  or (parsed.hostname or "").lower() != expected_origin[1]
                  or (parsed.port or 443) != expected_origin[2]
              ):
                  raise SystemExit(f"{label} is outside the configured download origin: {url}")
              if parsed.username is not None or parsed.password is not None:
                  raise SystemExit(f"{label} must not contain user information")
              if parsed.query or parsed.fragment:
                  raise SystemExit(f"{label} must not contain a query or fragment")
              if not parsed.path.startswith(parsed_base.path.rstrip("/") + "/"):
                  raise SystemExit(f"{label} is outside the configured download path: {url}")
              segments = parsed.path.split("/")[1:]
              if any(segment in ("", ".", "..") for segment in segments):
                  raise SystemExit(f"{label} path contains an empty or traversal segment")
              return parsed.geturl()

          MAX_DOWNLOAD_INDEX_BYTES = 4 * 1024 * 1024

          class SafeRedirectHandler(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file_pointer, code, message, headers, new_url):
                  target = urllib.parse.urljoin(request.full_url, new_url)
                  validate_download_url(target, "download redirect target")
                  return super().redirect_request(
                      request,
                      file_pointer,
                      code,
                      message,
                      headers,
                      target,
                  )

          download_opener = urllib.request.build_opener(SafeRedirectHandler())

          def open_validated(url, label):
              validate_download_url(url, label)
              response = download_opener.open(url, timeout=60)
              final_url = validate_download_url(
                  response.geturl(),
                  f"{label} final target",
              )
              if final_url != validate_download_url(url, label):
                  response.close()
                  raise SystemExit(f"{label} was redirected unexpectedly: {url}")
              return response

          if os.path.getsize(manifest_path) > MAX_DOWNLOAD_INDEX_BYTES:
              raise SystemExit("release manifest is too large")
          for artifact in manifest["artifacts"]:
              expected_size = artifact.get("size_bytes")
              if not isinstance(expected_size, int) or expected_size <= 0:
                  raise SystemExit(
                      f"artifact size is missing or invalid: {artifact.get('url')}"
                  )
              artifact_url = str(artifact.get("url", ""))
              response = open_validated(artifact_url, "artifact URL")
              with response:
                  content_length = response.headers.get("Content-Length")
                  if content_length is not None:
                      try:
                          declared_size = int(content_length)
                      except ValueError as error:
                          raise SystemExit(
                              f"artifact has an invalid Content-Length: {artifact_url}"
                          ) from error
                      if declared_size != expected_size:
                          raise SystemExit(
                              f"artifact size does not match the manifest: {artifact_url}"
                          )
                  digest = hashlib.sha256()
                  received = 0
                  try:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          received += len(chunk)
                          if received > expected_size:
                              raise SystemExit(
                                  f"artifact exceeds its manifest size: {artifact_url}"
                              )
                          digest.update(chunk)
                  except (OSError, urllib.error.URLError) as error:
                      raise SystemExit(
                          f"artifact download failed: {artifact_url}: {error}"
                      ) from error
                  if received != expected_size:
                      raise SystemExit(
                          f"artifact shorter than its manifest size: {artifact_url}"
                      )
                  remote_digest = digest.hexdigest()
              if remote_digest != artifact["sha256"]:
                  raise SystemExit(f"checksum mismatch: {artifact['url']}")
          print(f"verified {len(manifest['artifacts'])} download artifacts")
          PY
          python3 - "$current_index" \
            "${{ steps.detect.outputs.version }}" \
            "$download_base_url" \
            "$index_sha256" <<'PY'
          import hashlib
          import json
          import os
          import sys
          import urllib.request
          from urllib.parse import urlsplit

          MAX_INDEX_BYTES = 4 * 1024 * 1024
          index_path, version, base_url, expected_index_sha256 = (
              sys.argv[1],
              sys.argv[2],
              sys.argv[3].rstrip("/"),
              sys.argv[4],
          )

          def load_index_bytes(payload):
              if len(payload) > MAX_INDEX_BYTES:
                  raise SystemExit("download index is too large")
              return json.loads(payload.decode("utf-8"))

          with open(index_path, "rb") as input_file:
              before_payload = input_file.read()
          if hashlib.sha256(before_payload).hexdigest() != expected_index_sha256:
              raise SystemExit("candidate index checksum does not match")
          before = load_index_bytes(before_payload)
          with urllib.request.urlopen(f"{base_url}/index.json", timeout=60) as response:
              after = load_index_bytes(response.read(MAX_INDEX_BYTES + 1))

          def matching_release(index):
              matches = [
                  release
                  for release in index.get("releases", [])
                  if isinstance(release, dict) and release.get("version") == version
              ]
              if len(matches) > 1:
                  raise SystemExit(f"download index contains duplicate {version} releases")
              return matches[0] if matches else None

          if matching_release(before) != matching_release(after):
              raise SystemExit("candidate staging changed the public release index")

          matches = [
              release
              for release in after.get("releases", [])
              if isinstance(release, dict) and release.get("version") == version
          ]
          if matches:
              expected_release = f"{base_url}/{version}/stable/manifest.json"
              manifest_url = str(matches[0].get("manifest_url", ""))
              parsed_base = urlsplit(base_url)
              parsed_manifest = urlsplit(manifest_url)
              if any(character in manifest_url for character in ("?", "#", "@", "\\", "%")):
                  raise SystemExit("download index manifest URL contains unsafe characters")
              if (
                  parsed_manifest.scheme != parsed_base.scheme
                  or (parsed_manifest.hostname or "").lower()
                  != (parsed_base.hostname or "").lower()
                  or (parsed_manifest.port or 443) != (parsed_base.port or 443)
                  or manifest_url != expected_release
              ):
                  raise SystemExit("download index points at an unexpected release manifest")
          PY

      - name: Create immutable GitHub release
        id: publish_github_release
        if: steps.detect.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.detect.outputs.tag }}
          RELEASE_VERSION: ${{ steps.detect.outputs.version }}
          RELEASE_EXISTS: ${{ steps.detect.outputs.release_exists }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_EXISTS" == "true" ]]; then
            echo "Release $RELEASE_TAG already exists; continuing recovery checks."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" dist/github-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "如此萌屋平台 $RELEASE_VERSION" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" dist/github-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "如此萌屋平台 $RELEASE_VERSION" \
              --notes-file release-notes.md
          fi

      - name: Recover and verify GitHub release assets
        id: verify_github_release
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.detect.outputs.tag }}
        run: |
          set -euo pipefail
          expected="$(find dist/github-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          rm -rf "$RUNNER_TEMP/github-release-assets"
          mkdir -p "$RUNNER_TEMP/github-release-assets"
          read_assets() {
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              > "$RUNNER_TEMP/release-assets.json"
            python3 - "$RUNNER_TEMP/release-assets.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as input_file:
              release = json.load(input_file)
          assets = release.get("assets")
          if not isinstance(assets, list):
              raise SystemExit("GitHub release asset list is invalid")
          names = []
          for asset in assets:
              if not isinstance(asset, dict) or not isinstance(asset.get("name"), str):
                  raise SystemExit("GitHub release asset metadata is invalid")
              names.append(asset["name"])
          if len(names) != len(set(names)):
              raise SystemExit("GitHub release contains duplicate assets")
          print("\n".join(sorted(names)))
          PY
          }
          actual="$(read_assets)"
          if [[ "$actual" != "$expected" ]]; then
            missing="$(comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$actual"))"
            extra="$(comm -13 <(printf '%s\n' "$expected") <(printf '%s\n' "$actual"))"
            if [[ -n "$extra" ]]; then
              echo "GitHub release contains unexpected assets; refusing to modify an immutable release." >&2
              printf '%s\n' "$extra" >&2
              exit 1
            fi
            while IFS= read -r asset; do
              if [[ -z "$asset" ]]; then
                continue
              fi
              gh release upload "$RELEASE_TAG" "dist/github-assets/$asset" \
                --repo "$GITHUB_REPOSITORY"
            done <<< "$missing"
            read_assets > "$RUNNER_TEMP/release-assets-after.json"
            printf '%s\n' "$expected" > "$RUNNER_TEMP/release-assets-expected.json"
            if ! diff -u "$RUNNER_TEMP/release-assets-expected.json" \
                "$RUNNER_TEMP/release-assets-after.json"; then
              echo "GitHub release assets remain incomplete after recovery upload." >&2
              exit 1
            fi
          fi
          is_draft="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq '.isDraft')"
          if [[ "$is_draft" == "true" ]]; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq '.isDraft' | grep -qx 'false'
          fi
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            --dir "$RUNNER_TEMP/github-release-assets"
          (cd "$RUNNER_TEMP/github-release-assets" && sha256sum -c SHA256SUMS)

