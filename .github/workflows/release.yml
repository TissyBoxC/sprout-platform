                  raise SystemExit("candidate manifest contains no artifacts")
              remote_manifest = (
                  f"releases/{version}/{candidate_channel}/manifest.json"
              )
              lines.append(
                  f"put {uploader.shell_quote(manifest_path)} "
                  f"{uploader.shell_quote(remote_manifest)}"
              )
              batch_file.write_text("\n".join(lines) + "\n", encoding="utf-8")
              uploader.run_sftp(
                  batch_file=batch_file,
                  host=host,
                  port=int(port),
                  user=user,
                  private_key=Path(private_key),
                  known_hosts=Path(known_hosts),
