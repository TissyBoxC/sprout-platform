http:
  host: "0.0.0.0"
  port: "8082"

internal:
  # Keep the management API disabled until service identity is configured.
  enabled: false
  auth_token: "change-me"

log:
  level: "info"

redis:
  address: "127.0.0.1:6379"
  password: ""

sub2api:
  base_url: "http://127.0.0.1:8080"
  api_key: "change-me"

security:
  content_policy_enabled: true
  input_filter_enabled: true
  output_filter_enabled: true
  max_input_runes: 1200

# The gateway reads parent policies directly from the platform database. It is
# the same read connection used for usage recording, so no separate policy
# service is required. Set this to the platform PostgreSQL DSN in production.
database:
  dsn: "postgres://sprout:change-me@127.0.0.1:5432/sprout_device_platform?sslmode=disable"

websocket:
  # Keep the realtime endpoint disabled until the device token verifier is set.
  enabled: false
  path: "/v1/voice"
  # Exact browser origins, comma-separated in VOICE_GATEWAY_WS_ALLOWED_ORIGINS.
  # Requests without Origin remain valid for authenticated firmware/native clients.
  allowed_origins: []
  # Keep a completed conversation reusable for this short follow-up window.
  continuity_window_seconds: 60

intercom:
  # Guardian-to-device voice intercom relay. Keep it disabled until the internal
  # API token below is configured, because relay authorization is an internal
  # endpoint that device_platform calls with that token.
  enabled: false
  path: "/v1/intercom"
  # Bounded by the platform domain limit of 600 seconds.
  max_call_duration_seconds: 600
  max_frame_bytes: 4096
  max_frames_per_second: 80
  max_bytes_per_second: 131072
  write_queue_depth: 64
  max_relays: 256
  write_timeout_seconds: 10
  pong_wait_seconds: 60
  ping_interval_seconds: 25
