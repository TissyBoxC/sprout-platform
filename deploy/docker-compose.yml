name: sprout-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SPROUT_POSTGRES_USER:-sprout}
      POSTGRES_PASSWORD: ${SPROUT_POSTGRES_PASSWORD:?set SPROUT_POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${SPROUT_POSTGRES_DB:-sprout}
    ports:
      - "127.0.0.1:${SPROUT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - sprout_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SPROUT_POSTGRES_USER:-sprout} -d ${SPROUT_POSTGRES_DB:-sprout}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${SPROUT_REDIS_PASSWORD:?set SPROUT_REDIS_PASSWORD in deploy/.env}",
      ]
    ports:
      - "127.0.0.1:${SPROUT_REDIS_PORT:-6379}:6379"
    volumes:
      - sprout_redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${SPROUT_REDIS_PASSWORD}\" ping | grep PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    environment:
      SPROUT_REDIS_PASSWORD: ${SPROUT_REDIS_PASSWORD:?set SPROUT_REDIS_PASSWORD in deploy/.env}
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:${SPROUT_MQTT_PORT:-1883}:1883"
      - "127.0.0.1:${SPROUT_MQTTS_PORT:-8883}:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - sprout_mqtt_data:/mosquitto/data
      - sprout_mqtt_log:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 8883 --cafile /mosquitto/certs/ca.crt --cert /mosquitto/certs/device.crt --key /mosquitto/certs/device.key -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped

  sub2api:
    build:
      context: ../services/sub2api_fork
      dockerfile: Dockerfile
    image: sprout-local-sub2api:${SPROUT_SUB2API_VERSION:-local}
    profiles:
      - ai
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    ports:
      - "127.0.0.1:${SPROUT_SUB2API_PORT:-8080}:8080"
    volumes:
      - sprout_sub2api_data:/app/data
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      SERVER_MODE: "release"
      DATABASE_HOST: "postgres"
      DATABASE_PORT: "5432"
      DATABASE_USER: ${SPROUT_POSTGRES_USER:-sprout}
      DATABASE_PASSWORD: ${SPROUT_POSTGRES_PASSWORD:?set SPROUT_POSTGRES_PASSWORD in deploy/.env}
      DATABASE_DBNAME: ${SPROUT_SUB2API_DATABASE_NAME:-sprout_sub2api}
      DATABASE_SSLMODE: "disable"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${SPROUT_REDIS_PASSWORD:?set SPROUT_REDIS_PASSWORD in deploy/.env}
      REDIS_DB: "1"
      ADMIN_EMAIL: ${SPROUT_SUB2API_ADMIN_EMAIL:-admin@sprout.local}
      ADMIN_PASSWORD: ${SPROUT_SUB2API_ADMIN_PASSWORD:?set SPROUT_SUB2API_ADMIN_PASSWORD in deploy/.env}
      JWT_SECRET: ${SPROUT_SUB2API_JWT_SECRET:?set SPROUT_SUB2API_JWT_SECRET in deploy/.env}
      TOTP_ENCRYPTION_KEY: ${SPROUT_SUB2API_TOTP_ENCRYPTION_KEY:?set SPROUT_SUB2API_TOTP_ENCRYPTION_KEY in deploy/.env}
      TZ: ${SPROUT_TIMEZONE:-Asia/Shanghai}
      SECURITY_URL_ALLOWLIST_ENABLED: "true"
      SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP: "false"
      SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS: "false"
      SPROUT_INTERNAL_API_ENABLED: "true"
      SPROUT_INTERNAL_API_TOKEN: ${SPROUT_INTERNAL_SERVICE_TOKEN:?set SPROUT_INTERNAL_SERVICE_TOKEN in deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  admin_web:
    build:
      # The console imports generated contracts from packages/, so the build
      # context must be the platform root rather than only apps/admin_web.
      context: ..
      dockerfile: apps/admin_web/Dockerfile
      args:
        # The console uses same-origin /api through Nginx by default. Override
        # only when deploying the static bundle behind an external API host.
        VITE_API_BASE_URL: ${SPROUT_ADMIN_API_BASE_URL:-}
        VITE_API_TIMEOUT_MS: ${SPROUT_ADMIN_API_TIMEOUT_MS:-15000}
    image: sprout-local-admin_web:${SPROUT_PLATFORM_VERSION:-local}
    profiles:
      - services
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${SPROUT_ADMIN_WEB_PORT:-8083}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    depends_on:
      device_platform:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  device_platform:
    build:
      context: ..
      dockerfile: services/device_platform/Dockerfile
    image: sprout-local-device_platform:${SPROUT_PLATFORM_VERSION:-local}
    profiles:
      - services
    ports:
      - "127.0.0.1:${SPROUT_DEVICE_PLATFORM_PORT:-8081}:8081"
    environment:
      DEVICE_PLATFORM_HTTP_HOST: "0.0.0.0"
      DEVICE_PLATFORM_HTTP_PORT: "8081"
      DEVICE_PLATFORM_DATABASE_DSN: "postgres://${SPROUT_POSTGRES_USER:-sprout}:${SPROUT_POSTGRES_PASSWORD:?set SPROUT_POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${SPROUT_DEVICE_PLATFORM_DATABASE_NAME:-sprout_device_platform}?sslmode=disable"
      DEVICE_PLATFORM_REDIS_ADDRESS: "redis:6379"
      DEVICE_PLATFORM_REDIS_PASSWORD: ${SPROUT_REDIS_PASSWORD:?set SPROUT_REDIS_PASSWORD in deploy/.env}
      DEVICE_PLATFORM_REDIS_DB: "0"
      DEVICE_PLATFORM_MQTT_BROKER: "tls://mqtt:8883"
      DEVICE_PLATFORM_MQTT_CLIENT_ID: "device-platform"
      DEVICE_PLATFORM_MQTT_CA_FILE: "/run/sprout/mqtt/ca.crt"
      DEVICE_PLATFORM_MQTT_CLIENT_CERTIFICATE_FILE: "/run/sprout/mqtt/device.crt"
      DEVICE_PLATFORM_MQTT_CLIENT_KEY_FILE: "/run/sprout/mqtt/device.key"
      DEVICE_PLATFORM_MQTT_INSECURE_SKIP_VERIFY: "false"
      DEVICE_PLATFORM_AUTH_ACCESS_TOKEN_SECRET: ${SPROUT_AUTH_ACCESS_TOKEN_SECRET:?set SPROUT_AUTH_ACCESS_TOKEN_SECRET in deploy/.env}
      DEVICE_PLATFORM_AUTH_ACCESS_TOKEN_TTL: ${SPROUT_AUTH_ACCESS_TOKEN_TTL:-15m}
      DEVICE_PLATFORM_AUTH_REFRESH_TOKEN_TTL: ${SPROUT_AUTH_REFRESH_TOKEN_TTL:-720h}
      DEVICE_PLATFORM_AI_CREDENTIAL_KEY: ${SPROUT_AI_CREDENTIAL_KEY:?set SPROUT_AI_CREDENTIAL_KEY in deploy/.env}
      DEVICE_PLATFORM_MFA_CREDENTIAL_KEY: ${SPROUT_MFA_CREDENTIAL_KEY:?set SPROUT_MFA_CREDENTIAL_KEY in deploy/.env}
      DEVICE_PLATFORM_MFA_CHALLENGE_TTL: ${SPROUT_MFA_CHALLENGE_TTL:-5m}
      DEVICE_PLATFORM_PHONE_VERIFICATION_MODE: ${SPROUT_PHONE_VERIFICATION_MODE:-local}
      DEVICE_PLATFORM_ALLOW_LOCAL_SMS_BYPASS: ${SPROUT_ALLOW_LOCAL_SMS_BYPASS:-true}
      DEVICE_PLATFORM_SUB2API_BASE_URL: "http://sub2api:8080"
      DEVICE_PLATFORM_SUB2API_SERVICE_TOKEN: ${SPROUT_INTERNAL_SERVICE_TOKEN:?set SPROUT_INTERNAL_SERVICE_TOKEN in deploy/.env}
      DEVICE_PLATFORM_AI_DEFAULT_BALANCE_USD: ${SPROUT_AI_DEFAULT_BALANCE_USD:-0}
      DEVICE_PLATFORM_AI_DEFAULT_CONCURRENCY: ${SPROUT_AI_DEFAULT_CONCURRENCY:-1}
      DEVICE_PLATFORM_AI_DEFAULT_MODELS: ${SPROUT_AI_DEFAULT_MODELS:-}
      DEVICE_PLATFORM_OTA_MANIFEST_BASE_URL: ${SPROUT_OTA_MANIFEST_BASE_URL:-}
      DEVICE_PLATFORM_OTA_RESOURCE_BASE_URL: ${SPROUT_OTA_RESOURCE_BASE_URL:-}
      DEVICE_PLATFORM_OTA_CLIENT_BASE_URL: ${SPROUT_OTA_CLIENT_BASE_URL:-}
      DEVICE_PLATFORM_DOWNLOAD_STORE_DIR: "/srv/releases"
      DEVICE_PLATFORM_SERVICE_VERSION_STATE_DIR: "/var/lib/sprout-upgrades"
      DEVICE_PLATFORM_SERVICE_VERSION_UPGRADE_EXECUTION: "false"
      DEVICE_PLATFORM_UI_TEXT_SIGNATURE_PUBLIC_KEYS: ${SPROUT_UI_TEXT_SIGNATURE_PUBLIC_KEYS:-}
    volumes:
      - ./mosquitto/certs:/run/sprout/mqtt:ro
      - sprout_local_releases:/srv/releases
      - sprout_local_upgrades:/var/lib/sprout-upgrades
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
      sub2api:
        condition: service_healthy
      sprout_local_version_worker:
        condition: service_started
      sprout_local_volume_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8081/readyz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  voice_gateway:
    build:
      context: ..
      dockerfile: services/voice_gateway/Dockerfile
    image: sprout-local-voice_gateway:${SPROUT_PLATFORM_VERSION:-local}
    profiles:
      - services
    ports:
      - "127.0.0.1:${SPROUT_VOICE_GATEWAY_PORT:-8082}:8082"
    environment:
      VOICE_GATEWAY_HTTP_HOST: "0.0.0.0"
      VOICE_GATEWAY_HTTP_PORT: "8082"
      VOICE_GATEWAY_REDIS_ADDRESS: "redis:6379"
      VOICE_GATEWAY_REDIS_PASSWORD: ${SPROUT_REDIS_PASSWORD:?set SPROUT_REDIS_PASSWORD in deploy/.env}
      VOICE_GATEWAY_SUB2API_BASE_URL: "http://sub2api:8080"
      VOICE_GATEWAY_SUB2API_API_KEY: ${SPROUT_SUB2API_API_KEY:?set SPROUT_SUB2API_API_KEY in deploy/.env}
      VOICE_GATEWAY_DATABASE_DSN: "postgres://${SPROUT_POSTGRES_USER:-sprout}:${SPROUT_POSTGRES_PASSWORD:?set SPROUT_POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${SPROUT_DEVICE_PLATFORM_DATABASE_NAME:-sprout_device_platform}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8082/readyz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  sprout_local_volume_init:
    image: alpine:3.22
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    command:
      [
        "sh",
        "-c",
        "mkdir -p /srv/releases /var/lib/sprout-upgrades && chown 65532:65532 /srv/releases /var/lib/sprout-upgrades && chmod 0750 /srv/releases /var/lib/sprout-upgrades",
      ]
    volumes:
      - sprout_local_releases:/srv/releases
      - sprout_local_upgrades:/var/lib/sprout-upgrades
    restart: "no"

  sprout_local_version_worker:
    build:
      context: ..
      dockerfile: deploy/local_version_worker/Dockerfile
    image: sprout-local-version-worker:${SPROUT_PLATFORM_VERSION:-local}
    profiles:
      - services
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    environment:
      SPROUT_LOCAL_VERSION_STATE_DIR: "/var/lib/sprout-upgrades"
      SPROUT_LOCAL_VERSION_CHECK_INTERVAL_SECONDS: "${SPROUT_LOCAL_VERSION_CHECK_INTERVAL_SECONDS:-300}"
      SPROUT_LOCAL_VERSION_PLATFORM_REPOSITORY: "TissyBoxC/sprout-platform"
      SPROUT_LOCAL_VERSION_SUB2API_REPOSITORY: "TissyBoxC/sprout-sub2api-fork"
      SPROUT_PLATFORM_VERSION: "${SPROUT_PLATFORM_VERSION:-local}"
      SPROUT_SUB2API_VERSION: "${SPROUT_SUB2API_VERSION:-local}"
    volumes:
      - sprout_local_upgrades:/var/lib/sprout-upgrades
    depends_on:
      sprout_local_volume_init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /var/lib/sprout-upgrades/status.json && test -s /var/lib/sprout-upgrades/releases.json",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  sprout_postgres_data:
  sprout_redis_data:
  sprout_mqtt_data:
  sprout_mqtt_log:
  sprout_sub2api_data:
  sprout_local_releases:
  sprout_local_upgrades:
