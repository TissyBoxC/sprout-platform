name: sprout

# Cloud deployment for 1Panel.
#
# This file is intentionally separate from deploy/docker-compose.yml:
# the local stack builds from source, while a cloud host should pull the
# immutable images published by GitHub Releases.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SPROUT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SPROUT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SPROUT_POSTGRES_DB}
    volumes:
      - sprout_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SPROUT_POSTGRES_USER} -d ${SPROUT_POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${SPROUT_REDIS_PASSWORD}",
      ]
    environment:
      SPROUT_REDIS_PASSWORD: ${SPROUT_REDIS_PASSWORD}
    volumes:
      - sprout_redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${SPROUT_REDIS_PASSWORD}\" ping | grep PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "${SPROUT_MQTT_BIND_ADDRESS}:${SPROUT_MQTT_PORT}:1883"
      - "${SPROUT_MQTTS_BIND_ADDRESS}:${SPROUT_MQTTS_PORT}:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/certs/broker:/mosquitto/certs:ro
      - sprout_mqtt_data:/mosquitto/data
      - sprout_mqtt_log:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 8883 --cafile /mosquitto/certs/ca.crt --cert /mosquitto/certs/healthcheck.crt --key /mosquitto/certs/healthcheck.key -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped

  sub2api:
    image: ghcr.io/tissyboxc/sub2api:${SPROUT_SUB2API_VERSION}
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SPROUT_SERVICE_BIND_ADDRESS}:${SPROUT_SUB2API_PORT}:8080"
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    volumes:
      - sprout_sub2api_data:/app/data
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      SERVER_MODE: "release"
      DATABASE_HOST: "postgres"
      DATABASE_PORT: "5432"
      DATABASE_USER: ${SPROUT_POSTGRES_USER}
      DATABASE_PASSWORD: ${SPROUT_POSTGRES_PASSWORD}
      DATABASE_DBNAME: ${SPROUT_SUB2API_DATABASE_NAME}
      DATABASE_SSLMODE: "disable"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${SPROUT_REDIS_PASSWORD}
      REDIS_DB: "1"
      ADMIN_EMAIL: ${SPROUT_SUB2API_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${SPROUT_SUB2API_ADMIN_PASSWORD}
      JWT_SECRET: ${SPROUT_SUB2API_JWT_SECRET}
      TOTP_ENCRYPTION_KEY: ${SPROUT_SUB2API_TOTP_ENCRYPTION_KEY}
      TZ: ${SPROUT_TIMEZONE}
      SECURITY_URL_ALLOWLIST_ENABLED: "true"
      SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP: "false"
      SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS: "false"
      SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS: "${SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS:-sub.unsee.you,api.openai.com,api.anthropic.com,api.kimi.com,api.moonshot.ai,api.moonshot.cn,open.bigmodel.cn,api.minimaxi.com,api.minimax.io,opencode.ai,generativelanguage.googleapis.com,cloudcode-pa.googleapis.com,*.openai.azure.com}"
      SPROUT_INTERNAL_API_ENABLED: "true"
      SPROUT_INTERNAL_API_TOKEN: ${SPROUT_INTERNAL_SERVICE_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  device_platform:
    image: ghcr.io/tissyboxc/sprout-device-platform:${SPROUT_PLATFORM_VERSION}
    user: "${SPROUT_DEVICE_PLATFORM_UID}:${SPROUT_DOWNLOAD_SFTP_GID}"
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SPROUT_SERVICE_BIND_ADDRESS}:${SPROUT_DEVICE_PLATFORM_PORT}:8081"
    environment:
      DEVICE_PLATFORM_HTTP_HOST: "0.0.0.0"
      DEVICE_PLATFORM_HTTP_PORT: "8081"
      DEVICE_PLATFORM_DATABASE_DSN: "postgres://${SPROUT_POSTGRES_USER}:${SPROUT_POSTGRES_PASSWORD}@postgres:5432/${SPROUT_DEVICE_PLATFORM_DATABASE_NAME}?sslmode=disable"
      DEVICE_PLATFORM_REDIS_ADDRESS: "redis:6379"
      DEVICE_PLATFORM_REDIS_PASSWORD: ${SPROUT_REDIS_PASSWORD}
      DEVICE_PLATFORM_REDIS_DB: "0"
      DEVICE_PLATFORM_MQTT_BROKER: "tls://mqtt:8883"
      DEVICE_PLATFORM_MQTT_CLIENT_ID: "device-platform"
      DEVICE_PLATFORM_MQTT_CA_FILE: "/run/sprout/mqtt/ca.crt"
      DEVICE_PLATFORM_MQTT_CLIENT_CERTIFICATE_FILE: "/run/sprout/mqtt/device.crt"
      DEVICE_PLATFORM_MQTT_CLIENT_KEY_FILE: "/run/sprout/mqtt/device.key"
      DEVICE_PLATFORM_MQTT_INSECURE_SKIP_VERIFY: "false"
      DEVICE_PLATFORM_AUTH_ACCESS_TOKEN_SECRET: ${SPROUT_AUTH_ACCESS_TOKEN_SECRET}
      DEVICE_PLATFORM_AUTH_ACCESS_TOKEN_TTL: ${SPROUT_AUTH_ACCESS_TOKEN_TTL}
      DEVICE_PLATFORM_AUTH_REFRESH_TOKEN_TTL: ${SPROUT_AUTH_REFRESH_TOKEN_TTL}
      DEVICE_PLATFORM_AI_CREDENTIAL_KEY: ${SPROUT_AI_CREDENTIAL_KEY}
      DEVICE_PLATFORM_MFA_CREDENTIAL_KEY: ${SPROUT_MFA_CREDENTIAL_KEY}
      DEVICE_PLATFORM_MFA_CHALLENGE_TTL: ${SPROUT_MFA_CHALLENGE_TTL}
      DEVICE_PLATFORM_PHONE_VERIFICATION_MODE: ${SPROUT_PHONE_VERIFICATION_MODE}
      DEVICE_PLATFORM_ALLOW_LOCAL_SMS_BYPASS: ${SPROUT_ALLOW_LOCAL_SMS_BYPASS}
      DEVICE_PLATFORM_INTERNAL_API_ENABLED: "true"
      DEVICE_PLATFORM_INTERNAL_API_TOKEN: ${SPROUT_INTERNAL_SERVICE_TOKEN}
      DEVICE_PLATFORM_RELEASE_UPLOAD_TOKEN: "${SPROUT_RELEASE_UPLOAD_TOKEN:-}"
      DEVICE_PLATFORM_SUB2API_BASE_URL: "http://sub2api:8080"
      DEVICE_PLATFORM_SUB2API_SERVICE_TOKEN: ${SPROUT_INTERNAL_SERVICE_TOKEN}
      DEVICE_PLATFORM_AI_DEFAULT_BALANCE_USD: ${SPROUT_AI_DEFAULT_BALANCE_USD}
      DEVICE_PLATFORM_AI_DEFAULT_CONCURRENCY: ${SPROUT_AI_DEFAULT_CONCURRENCY}
      DEVICE_PLATFORM_AI_DEFAULT_MODELS: ${SPROUT_AI_DEFAULT_MODELS}
      DEVICE_PLATFORM_OTA_MANIFEST_BASE_URL: "${SPROUT_OTA_MANIFEST_BASE_URL:-}"
      DEVICE_PLATFORM_OTA_RESOURCE_BASE_URL: "${SPROUT_OTA_RESOURCE_BASE_URL:-}"
      DEVICE_PLATFORM_OTA_CLIENT_BASE_URL: "${SPROUT_OTA_CLIENT_BASE_URL:-}"
      DEVICE_PLATFORM_VOICE_GATEWAY_WS_URL: "${SPROUT_VOICE_GATEWAY_PUBLIC_WS_URL:-}"
      DEVICE_PLATFORM_VOICE_GATEWAY_WS_TOKEN_SECRET: "${SPROUT_VOICE_GATEWAY_WS_TOKEN_SECRET:-}"
      DEVICE_PLATFORM_VOICE_TOKEN_TTL_SECONDS: "${SPROUT_VOICE_GATEWAY_DEVICE_TOKEN_TTL_SECONDS:-300}"
      DEVICE_PLATFORM_DOWNLOAD_STORE_DIR: "/srv/releases"
      DEVICE_PLATFORM_DOWNLOAD_PUBLIC_BASE_URL: "${SPROUT_DOWNLOAD_PUBLIC_BASE_URL}"
      DEVICE_PLATFORM_SERVICE_VERSION_STATE_DIR: "${SPROUT_SERVICE_VERSION_STATE_DIR:-/var/lib/sprout-upgrades}"
      SPROUT_SERVICE_VERSION_STATE_DIR: "${SPROUT_SERVICE_VERSION_STATE_DIR:-/var/lib/sprout-upgrades}"
    volumes:
      - ./mosquitto/certs/device:/run/sprout/mqtt:ro
      - sprout_upgrade_data:${SPROUT_SERVICE_VERSION_STATE_DIR:-/var/lib/sprout-upgrades}
      - sprout_download_data:/srv/releases
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
      sub2api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8081/readyz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  voice_gateway:
    image: ghcr.io/tissyboxc/sprout-voice-gateway:${SPROUT_PLATFORM_VERSION}
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SPROUT_SERVICE_BIND_ADDRESS}:${SPROUT_VOICE_GATEWAY_PORT}:8082"
    environment:
      VOICE_GATEWAY_HTTP_HOST: "0.0.0.0"
      VOICE_GATEWAY_HTTP_PORT: "8082"
      VOICE_GATEWAY_REDIS_ADDRESS: "redis:6379"
      VOICE_GATEWAY_REDIS_PASSWORD: ${SPROUT_REDIS_PASSWORD}
      VOICE_GATEWAY_SUB2API_BASE_URL: "http://sub2api:8080"
      VOICE_GATEWAY_SUB2API_API_KEY: ${SPROUT_SUB2API_API_KEY}
      VOICE_GATEWAY_DATABASE_DSN: "postgres://${SPROUT_POSTGRES_USER}:${SPROUT_POSTGRES_PASSWORD}@postgres:5432/${SPROUT_DEVICE_PLATFORM_DATABASE_NAME}?sslmode=disable"
      VOICE_GATEWAY_WS_ENABLED: ${SPROUT_VOICE_GATEWAY_WS_ENABLED:-false}
      VOICE_GATEWAY_WS_PATH: ${SPROUT_VOICE_GATEWAY_WS_PATH:-/v1/voice}
      VOICE_GATEWAY_WS_TOKEN_SECRET: ${SPROUT_VOICE_GATEWAY_WS_TOKEN_SECRET:-}
      VOICE_GATEWAY_ASR_PROVIDER: ${SPROUT_VOICE_GATEWAY_ASR_PROVIDER:-}
      VOICE_GATEWAY_ASR_ENDPOINT: ${SPROUT_VOICE_GATEWAY_ASR_ENDPOINT:-}
      VOICE_GATEWAY_ASR_API_KEY: ${SPROUT_VOICE_GATEWAY_ASR_API_KEY:-}
      VOICE_GATEWAY_ASR_MODEL: ${SPROUT_VOICE_GATEWAY_ASR_MODEL:-}
      VOICE_GATEWAY_TTS_PROVIDER: ${SPROUT_VOICE_GATEWAY_TTS_PROVIDER:-}
      VOICE_GATEWAY_TTS_ENDPOINT: ${SPROUT_VOICE_GATEWAY_TTS_ENDPOINT:-}
      VOICE_GATEWAY_TTS_API_KEY: ${SPROUT_VOICE_GATEWAY_TTS_API_KEY:-}
      VOICE_GATEWAY_TTS_MODEL: ${SPROUT_VOICE_GATEWAY_TTS_MODEL:-}
      VOICE_GATEWAY_TTS_VOICE: ${SPROUT_VOICE_GATEWAY_TTS_VOICE:-}
      VOICE_GATEWAY_LLM_PROVIDER: ${SPROUT_VOICE_GATEWAY_LLM_PROVIDER:-sub2api}
      VOICE_GATEWAY_LLM_BASE_URL: "http://sub2api:8080"
      VOICE_GATEWAY_LLM_API_KEY: ${SPROUT_SUB2API_API_KEY}
      VOICE_GATEWAY_LLM_MODEL: ${SPROUT_VOICE_GATEWAY_LLM_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8082/readyz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  admin_web:
    image: ghcr.io/tissyboxc/sprout-admin-web:${SPROUT_PLATFORM_VERSION}
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SPROUT_SERVICE_BIND_ADDRESS}:${SPROUT_ADMIN_WEB_PORT}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    depends_on:
      device_platform:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  download_init:
    image: alpine:3.22@sha256:3e9b4b680bfc9fb5269227cffbd6d42be39fbf7c0b908123913864aa4447e764
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    command:
      [
        "sh",
        "-c",
        "chown -R ${SPROUT_DOWNLOAD_SFTP_UID}:${SPROUT_DOWNLOAD_SFTP_GID} /srv/releases && find /srv/releases -type d -exec chmod 2775 {} + && find /srv/releases -type f -exec chmod 664 {} +",
      ]
    volumes:
      - sprout_download_data:/srv/releases
    restart: "no"

  download_ftp:
    image: atmoz/sftp:alpine@sha256:6d41b9200f8115ce925bbd295376cb3c6b72634a267f41946e5aee4efe482186
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SPROUT_DOWNLOAD_SFTP_BIND_ADDRESS}:${SPROUT_DOWNLOAD_SFTP_PORT}:22"
    command:
      - "${SPROUT_DOWNLOAD_SFTP_USER}::${SPROUT_DOWNLOAD_SFTP_UID}:${SPROUT_DOWNLOAD_SFTP_GID}"
    volumes:
      - sprout_download_data:/home/${SPROUT_DOWNLOAD_SFTP_USER}/releases
      - "${SPROUT_DOWNLOAD_SFTP_AUTHORIZED_KEYS_DIR}:/home/${SPROUT_DOWNLOAD_SFTP_USER}/.ssh/keys:ro"
      - ./download/sftp/sshd_config:/etc/ssh/sshd_config:ro
      - ./download/sftp/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:ro
      - ./download/sftp/ssh_host_rsa_key:/etc/ssh/ssh_host_rsa_key:ro
    healthcheck:
      # Validate the configuration and a real local SSH handshake. The image
      # starts sshd as a PAM binary whose process name is not reliably "sshd".
      test:
        [
          "CMD-SHELL",
          "sshd -T >/dev/null 2>&1 && timeout 3 sh -c 'nc 127.0.0.1 22 </dev/null | grep -q \"^SSH-\"'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      download_init:
        condition: service_completed_successfully
    restart: unless-stopped

  download_http:
    image: nginx:1.27-alpine@sha256:62223d644fa234c3a1cc785ee14242ec47a77364226f1c811d2f669f96dc2ac8
    entrypoint: ["nginx", "-g", "daemon off;"]
    user: "101:101"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # The container entrypoint runs as UID/GID 101 under a read-only root
      # filesystem, so nginx's runtime directories must be explicitly writable.
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,size=64m,uid=101,gid=101,mode=0755
      - /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=0755
    ports:
      - "${SPROUT_DOWNLOAD_HTTP_BIND_ADDRESS}:${SPROUT_DOWNLOAD_HTTP_PORT}:8080"
    volumes:
      - sprout_download_data:/srv/releases:ro
      - ./download/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      # HTTP only needs the shared download volume prepared by download_init.
      # Upload authorization must not prevent read-only release downloads.
      download_init:
        condition: service_completed_successfully
    restart: unless-stopped

  upgrade_worker:
    image: ghcr.io/tissyboxc/sprout-upgrade-worker:${SPROUT_PLATFORM_VERSION}
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    environment:
      SPROUT_SERVICE_VERSION_STATE_DIR: "${SPROUT_SERVICE_VERSION_STATE_DIR:-/var/lib/sprout-upgrades}"
      SPROUT_SERVICE_VERSION_CLOUD_DIR: "/opt/sprout-source/deploy/cloud"
      SPROUT_SERVICE_VERSION_HOST_CLOUD_DIR: "${SPROUT_SERVICE_VERSION_HOST_CLOUD_DIR:-/opt/1panel/apps/sprout/deploy/cloud}"
      SPROUT_SERVICE_VERSION_CHECK_INTERVAL_SECONDS: "${SPROUT_SERVICE_VERSION_CHECK_INTERVAL_SECONDS:-60}"
      SPROUT_SERVICE_VERSION_RELEASE_CACHE_SECONDS: "${SPROUT_SERVICE_VERSION_RELEASE_CACHE_SECONDS:-300}"
      SPROUT_SERVICE_VERSION_RELEASE_CATALOG_LIMIT: "${SPROUT_SERVICE_VERSION_RELEASE_CATALOG_LIMIT:-100}"
      SPROUT_SERVICE_VERSION_POLL_INTERVAL_SECONDS: "${SPROUT_SERVICE_VERSION_POLL_INTERVAL_SECONDS:-5}"
      SPROUT_SERVICE_VERSION_MAX_REQUEST_BYTES: "${SPROUT_SERVICE_VERSION_MAX_REQUEST_BYTES:-65536}"
      SPROUT_SERVICE_VERSION_STATE_UID: "${SPROUT_SERVICE_VERSION_STATE_UID:-65532}"
      SPROUT_SERVICE_VERSION_STATE_GID: "${SPROUT_SERVICE_VERSION_STATE_GID:-65532}"
      SPROUT_UPGRADE_HEALTH_TIMEOUT_SECONDS: "${SPROUT_UPGRADE_HEALTH_TIMEOUT_SECONDS:-180}"
      SPROUT_UPGRADE_PLATFORM_REPOSITORY: "${SPROUT_UPGRADE_PLATFORM_REPOSITORY:-TissyBoxC/sprout-platform}"
      SPROUT_UPGRADE_SUB2API_REPOSITORY: "${SPROUT_UPGRADE_SUB2API_REPOSITORY:-TissyBoxC/sprout-sub2api-fork}"
      GITHUB_TOKEN: "${SPROUT_SERVICE_VERSION_GITHUB_TOKEN:-}"
    volumes:
      # Docker socket access is equivalent to host root. Do not expose this
      # worker to the network and never turn user input into a shell command.
      - /var/run/docker.sock:/var/run/docker.sock
      - sprout_upgrade_data:${SPROUT_SERVICE_VERSION_STATE_DIR:-/var/lib/sprout-upgrades}
      - ../..:/opt/sprout-source
    command:
      [
        "bash",
        "/opt/sprout-source/deploy/cloud/scripts/service-upgrade-worker.sh",
      ]
    healthcheck:
      # A running process is not enough: the worker is healthy only after it
      # publishes the status file the console reads.
      test:
        [
          "CMD-SHELL",
          "test -s ${SPROUT_SERVICE_VERSION_STATE_DIR:-/var/lib/sprout-upgrades}/status.json",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  sprout_postgres_data:
  sprout_redis_data:
  sprout_mqtt_data:
  sprout_mqtt_log:
  sprout_sub2api_data:
  sprout_download_data:
  sprout_upgrade_data:
